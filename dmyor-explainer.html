<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dmyor explainer</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #viewport { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; }
  #stage {
    position:relative; width:1080px; height:1920px; background:#0A0A0A; overflow:hidden;
    transform-origin:center center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- diary ---------- */
  #bookPersp { position:absolute; inset:0; perspective:3200px; perspective-origin:50% 52%; }
  #bookWorld { position:absolute; inset:0; transform-style:preserve-3d; }
  .edge { position:absolute; width:1px; background:rgba(245,245,240,.28); }
  #spine { position:absolute; width:1px; background:rgba(245,245,240,.45); }
  #diaryPage {
    position:absolute; border:1px solid rgba(245,245,240,.5);
    border-radius:3px; overflow:hidden; background:#0A0A0A;
  }
  .rule { position:absolute; height:1px; background:rgba(245,245,240,.09); }
  .written { position:absolute; color:#F5F5F0; font-size:25px; white-space:nowrap; }
  .caret { color:#8C8C86; font-weight:300; }
  /* the "nothing happens" pulse: a wish going out and dying */
  #pulse {
    position:absolute; z-index:8; width:80px; height:80px; margin:-40px 0 0 -40px;
    border-radius:50%; border:1px solid rgba(245,245,240,.7); opacity:0; pointer-events:none;
  }
  #flipLayer { position:absolute; inset:0; z-index:3; perspective:2600px; pointer-events:none; }
  #cover { position:absolute; transform-origin:left center; transform-style:preserve-3d; }
  .face {
    position:absolute; inset:0; backface-visibility:hidden; border-radius:4px;
    background:#0A0A0A; border:1px solid rgba(245,245,240,.55);
    display:flex; align-items:center; justify-content:center;
  }
  .coverInner { transform:rotateY(180deg); }
  .coverShade { position:absolute; inset:0; background:#000; opacity:0; border-radius:4px; }
  #coverTitle { text-align:center; color:#F5F5F0; font-size:40px; font-weight:600; line-height:1.3; }
  #coverTitle span {
    display:block; margin-top:18px; font-size:13px; letter-spacing:4px;
    font-weight:400; text-transform:uppercase; color:#8C8C86;
  }
  .ghostCard { position:absolute; border:1px solid rgba(245,245,240,.16); border-radius:6px; }

  /* ---------- archive ---------- */
  #canvasWrap { position:absolute; inset:0; z-index:2; transform-origin:0 0; opacity:0; }
  #gridLayer { position:absolute; left:46px; top:46px; width:988px; height:1828px; overflow:hidden; }
  #gridInner { position:absolute; left:0; top:0; width:988px; will-change:transform; }
  .colWrap { width:268px; }
  .col { display:flex; flex-direction:column; gap:30px; }
  .card { display:block; }
  .cardInner {
    box-sizing:border-box; height:100%; display:flex; flex-direction:column;
    justify-content:space-between; border:1px solid rgba(245,245,240,.22);
    border-radius:12px; padding:20px; color:#F5F5F0; opacity:0; transform:scale(.94);
  }
  .dream { font-size:20px; line-height:1.4; font-weight:500; }
  .meta { display:flex; align-items:baseline; justify-content:space-between; margin-top:14px; }
  .date { font-size:13px; color:#6B6B6B; }
  .standby { font-size:10px; letter-spacing:1.6px; font-variant:small-caps; text-transform:lowercase; color:#6B6B6B; }
  .isReal .standby { color:#F5F5F0; }
  #borderSvg { position:absolute; inset:0; width:1080px; height:1920px; pointer-events:none; }
  #hoverRing {
    position:absolute; z-index:4; box-sizing:border-box; border-radius:12px;
    border:1px solid rgba(245,245,240,.85); opacity:0; pointer-events:none;
  }

  /* ---------- timeline ---------- */
  #tl { position:absolute; left:0; top:0; width:1080px; height:1920px; pointer-events:none; opacity:0; }
  .tlLabel {
    position:absolute; color:#8C8C86; font-size:22px; letter-spacing:3px; opacity:0;
    background:#0A0A0A; padding:4px 10px; border-radius:6px;
  }

  /* ---------- tabs + phase panel ---------- */
  #ui { position:absolute; inset:0; z-index:6; }
  .tab {
    position:absolute; box-sizing:border-box; height:64px; border-radius:32px;
    border:1px solid rgba(245,245,240,.3); background:#0A0A0A; color:#8C8C86;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; letter-spacing:3px; text-transform:uppercase; opacity:0;
  }
  .tab.on { border-color:rgba(245,245,240,.85); color:#F5F5F0; }
  #panel {
    position:absolute; box-sizing:border-box; left:150px; width:780px;
    border:1px solid rgba(245,245,240,.3); border-radius:16px; background:#0A0A0A;
    padding:38px 36px; color:#F5F5F0; opacity:0;
  }
  #panelNo { font-size:13px; letter-spacing:4px; color:#8C8C86; text-transform:uppercase; }
  #panelTitle { margin-top:16px; font-size:36px; font-weight:600; }
  #panelBody { margin-top:16px; font-size:22px; line-height:1.5; color:#8C8C86; }

  /* ---------- compose ---------- */
  #compose {
    position:absolute; box-sizing:border-box; left:150px; width:780px;
    border:1px solid rgba(245,245,240,.34); border-radius:16px; background:#0A0A0A;
    padding:34px; color:#F5F5F0; opacity:0; z-index:6;
  }
  #composeLabel { font-size:13px; letter-spacing:4px; color:#8C8C86; text-transform:uppercase; }
  #field {
    margin-top:22px; box-sizing:border-box; height:78px; border-radius:10px;
    border:1px solid rgba(245,245,240,.25); display:flex; align-items:center;
    padding:0 20px; font-size:24px; color:#F5F5F0;
  }
  #field.focus { border-color:rgba(245,245,240,.8); }
  #postBtn {
    margin-top:24px; margin-left:auto; width:190px; height:60px; border-radius:30px;
    border:1px solid rgba(245,245,240,.4); display:flex; align-items:center; justify-content:center;
    font-size:16px; letter-spacing:3px; text-transform:uppercase; color:#F5F5F0;
  }
  #postBtn.hot { background:#F5F5F0; color:#0A0A0A; border-color:#F5F5F0; }
  #addBtn {
    position:absolute; box-sizing:border-box; left:340px; width:400px; height:74px;
    border-radius:37px; border:1px solid rgba(245,245,240,.45); background:#0A0A0A;
    display:flex; align-items:center; justify-content:center; color:#F5F5F0;
    font-size:19px; letter-spacing:2px; opacity:0; z-index:6;
  }
  #addBtn.hot { background:#F5F5F0; color:#0A0A0A; }
  #flyCard {
    position:absolute; box-sizing:border-box; z-index:7; border-radius:12px;
    border:1px solid rgba(245,245,240,.4); background:#0A0A0A; color:#F5F5F0;
    padding:18px 20px; opacity:0;
  }

  /* ---------- the magic diary, returning as a callback ---------- */
  #ghostDiary {
    position:absolute; z-index:8; left:390px; top:700px; width:300px; height:520px;
    border:1px solid rgba(245,245,240,.45); border-radius:6px; background:#0A0A0A;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#F5F5F0; opacity:0;
  }
  #ghostDiary .gt { font-size:30px; font-weight:600; }
  #ghostDiary .gs { margin-top:12px; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#8C8C86; }
  #ghostSlash { position:absolute; left:8%; top:50%; width:84%; height:1px; background:#F5F5F0; opacity:.75; transform:scaleX(0); transform-origin:left center; }

  /* ---------- the three simple steps ---------- */
  #steps { margin-top:24px; }
  .step {
    display:flex; align-items:baseline; gap:14px; margin-top:14px;
    font-size:21px; color:#F5F5F0; opacity:0;
  }
  .step i { font-style:normal; color:#8C8C86; font-size:13px; letter-spacing:3px; min-width:26px; }

  /* ---------- scanning the archive ---------- */
  #scan {
    position:absolute; z-index:5; left:46px; width:988px; height:2px;
    background:rgba(245,245,240,.55); opacity:0; pointer-events:none;
  }

  /* ---------- your-turn prompt ---------- */
  #prompt {
    position:absolute; z-index:6; box-sizing:border-box; left:150px; width:780px; top:1120px;
    border:1px dashed rgba(245,245,240,.4); border-radius:16px; background:#0A0A0A;
    padding:34px; color:#8C8C86; font-size:24px; opacity:0;
  }
  #prompt b { color:#F5F5F0; font-weight:400; }

  /* ---------- live counter ---------- */
  #counter {
    position:absolute; z-index:9; left:50%; transform:translateX(-50%); top:1740px;
    background:#0A0A0A; border:1px solid rgba(245,245,240,.28); border-radius:30px;
    padding:14px 30px; color:#8C8C86; font-size:22px; letter-spacing:1px; opacity:0;
    white-space:nowrap;
  }
  #counter b { color:#F5F5F0; font-weight:600; font-variant-numeric:tabular-nums; }

  /* ---------- cursor ---------- */
  #cursor { position:absolute; z-index:50; width:30px; height:36px; pointer-events:none; }
  #ripple {
    position:absolute; z-index:49; width:70px; height:70px; margin:-35px 0 0 -35px;
    border-radius:50%; border:2px solid rgba(245,245,240,.9); opacity:0; pointer-events:none;
  }

  /* ---------- captions ---------- */
  #textLayer { position:absolute; inset:0; z-index:20; }
  .beat { position:absolute; left:80px; width:920px; text-align:center; opacity:0; color:#F5F5F0; }
  /* an opaque plate so a caption never fights the archive behind it */
  .beat:not(.final) {
    box-sizing:border-box; background:#0A0A0A; padding:24px 26px; border-radius:16px;
  }
  .line1 { font-size:46px; line-height:1.3; font-weight:600; letter-spacing:-.5px; }
  .line2 { margin-top:18px; font-size:26px; line-height:1.45; color:#8C8C86; }
  .beat.final .line1 { font-size:104px; font-weight:700; }
  .beat.final .line2 { margin-top:26px; font-size:30px; letter-spacing:1px; }

  #playBtn {
    position:fixed; inset:0; margin:auto; width:200px; height:62px; border-radius:31px;
    border:1px solid rgba(245,245,240,.4); background:rgba(10,10,10,.92); color:#F5F5F0;
    font-family:inherit; font-size:18px; letter-spacing:2px; cursor:pointer; z-index:1000;
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">

    <div id="bookPersp"><div id="bookWorld">
      <div id="bookBase"><div id="spine"></div></div>
      <div id="diaryPage"></div>
      <div id="flipLayer">
        <div id="cover">
          <div class="face coverOuter"><div id="coverTitle">Dreams<span>a diary</span></div></div>
          <div class="face coverInner"></div>
          <div class="coverShade" id="coverShade"></div>
        </div>
      </div>
    </div></div>

    <div id="canvasWrap">
      <div id="gridLayer"><div id="gridInner"></div></div>
      <svg id="borderSvg" viewBox="0 0 1080 1920">
        <path d="M46,46 L1034,46 L1034,1874 L46,1874 Z" fill="none"
              stroke="rgba(245,245,240,0.55)" stroke-width="1.5"/>
      </svg>
    </div>
    <div id="hoverRing"></div>

    <svg id="tl" viewBox="0 0 1080 1920">
      <path id="tlPath" d="M250,1050 L830,1050" fill="none" stroke="rgba(245,245,240,.5)" stroke-width="2"/>
      <path id="tlA" d="M250,1036 L250,1064" stroke="rgba(245,245,240,.5)" stroke-width="2" opacity="0"/>
      <path id="tlB" d="M830,1036 L830,1064" stroke="rgba(245,245,240,.5)" stroke-width="2" opacity="0"/>
    </svg>
    <div class="tlLabel" id="tlLabA" style="left:212px; top:1082px;">2026</div>
    <div class="tlLabel" id="tlLabB" style="left:792px; top:1082px;">2031</div>

    <div id="ui">
      <div class="tab" id="tab1" style="left:150px; width:370px; top:560px;">Phase 01</div>
      <div class="tab" id="tab2" style="left:560px; width:370px; top:560px;">Phase 02</div>
      <div id="panel" style="top:680px;">
        <div id="panelNo"></div>
        <div id="panelTitle"></div>
        <div id="panelBody"></div>
        <div id="steps">
          <div class="step" id="st0"><i>01</i><span>Think what you actually want</span></div>
          <div class="step" id="st1"><i>02</i><span>Write it on dmyor</span></div>
          <div class="step" id="st2"><i>03</i><span>It is dated, public, permanent</span></div>
        </div>
      </div>
    </div>

    <div id="addBtn" style="top:1150px;">+ Post a dream</div>
    <div id="compose" style="top:1120px;">
      <div id="composeLabel">Your dream</div>
      <div id="field"><span id="fieldText"></span><span class="caret" id="fieldCaret">|</span></div>
      <div id="postBtn">Post</div>
    </div>
    <div id="flyCard"></div>

    <div id="ghostDiary"><div class="gt">Dreams</div><div class="gs">a diary</div><div id="ghostSlash"></div></div>
    <div id="scan"></div>
    <div id="prompt"><b>your dream here</b><span class="caret" id="promptCaret">|</span></div>
    <div id="counter"><b id="countNum">0</b> dreams on record</div>
    <div id="pulse"></div>
    <div id="ripple"></div>
    <svg id="cursor" viewBox="0 0 28 34">
      <path d="M3,2 L3,27 L10,20.5 L14.5,31 L19.5,29 L15,18.5 L24,17.5 Z"
            fill="#F5F5F0" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>

    <div id="textLayer"></div>
  </div>
</div>

<button id="playBtn">PLAY</button>

<script>
(function () {
  "use strict";
  var TOTAL = 100.2, W = 1080, H = 1920;
  var stage = document.getElementById("stage"), sc = 1;
  function fit() { sc = Math.min(innerWidth/W, innerHeight/H); stage.style.transform = "scale("+sc+")"; }
  fit(); addEventListener("resize", fit);

  var cl = function (x) { return x<0?0:(x>1?1:x); };
  var seg = function (t,a,b) { return cl((t-a)/(b-a)); };
  var eio = function (x) { return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; };
  var eo  = function (x) { return 1-Math.pow(1-x,3); };
  function rectOf(el) {
    var s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { left:(r.left-s.left)/sc, top:(r.top-s.top)/sc, width:r.width/sc, height:r.height/sc };
  }
  function fade(el, op) { el.style.opacity = op; }

  // ============ diary geometry ============
  var CS = 460/1080;
  var PX = 540, PY = 960 - 1920*CS/2;
  var INSET = 46*CS, PW = 988*CS, PH = 1828*CS, PTOP = PY + INSET;
  var FLIP_W = INSET + PW, COVER_W = FLIP_W + 12, COVER_H = PH + 20, COVER_TOP = PTOP - 10;
  var PAGE_L = PX + INSET;

  var diary = document.getElementById("diaryPage");
  diary.style.left = PAGE_L+"px"; diary.style.top = PTOP+"px";
  diary.style.width = PW+"px"; diary.style.height = PH+"px";
  var spine = document.getElementById("spine");
  spine.style.left = PX+"px"; spine.style.top = PTOP+"px"; spine.style.height = PH+"px";
  var bookBase = document.getElementById("bookBase");
  for (var e=0; e<4; e++) {
    var eg = document.createElement("div"); eg.className = "edge";
    eg.style.left = (PAGE_L+PW+2+e*2.5)+"px"; eg.style.top = (PTOP+6+e*2)+"px";
    eg.style.height = (PH-12-e*4)+"px"; eg.style.opacity = 1-e*.18;
    bookBase.appendChild(eg);
  }
  var cover = document.getElementById("cover");
  cover.style.left = PX+"px"; cover.style.top = COVER_TOP+"px";
  cover.style.width = COVER_W+"px"; cover.style.height = COVER_H+"px";
  var coverShade = document.getElementById("coverShade");
  var bookWorld = document.getElementById("bookWorld");

  function ghostGrid(c0,x0,y0,w,h,seed) {
    var GH=[58,70,54,65,76,56,68,61,73,52,64,71,57,67], pad=14, gap=11, cols=3;
    var cw=(w-pad*2-gap*(cols-1))/cols, st=[0,25,11];
    for (var c=0;c<cols;c++){ var y=y0+pad+st[(c+seed)%3];
      for(var k=0;;k++){ var hh=GH[(k+seed*3+c)%GH.length];
        if (y+hh>y0+h-pad) break;
        var g=document.createElement("div"); g.className="ghostCard";
        g.style.left=(x0+pad+c*(cw+gap))+"px"; g.style.width=cw+"px";
        g.style.top=y+"px"; g.style.height=hh+"px"; c0.appendChild(g); y+=hh+gap; } }
  }
  ghostGrid(document.querySelector(".coverInner"), INSET-4, 10, PW, PH, 2);

  // written lines, tick boxes, strikes
  var WRITTEN = ["Run my own business","Travel the whole world","Buy my parents a house"];
  var L_TOP = 104, L_GAP = 74, L_X = 34, CHAR_W = 12.4;
  for (var i=0;i<8;i++){ var r=document.createElement("div"); r.className="rule";
    r.style.left=L_X+"px"; r.style.width=(PW-L_X*2)+"px"; r.style.top=(L_TOP+i*L_GAP+34)+"px"; diary.appendChild(r); }

  var lines = WRITTEN.map(function (txt,i) {
    var d=document.createElement("div"); d.className="written";
    d.style.left=L_X+"px"; d.style.top=(L_TOP+i*L_GAP)+"px";
    d.innerHTML='<span class="t"></span><span class="caret">|</span>';
    diary.appendChild(d);
    return { el:d, txt:d.querySelector(".t"), caret:d.querySelector(".caret"),
             absY: PTOP + L_TOP + i*L_GAP, absX: PAGE_L + L_X };
  });

  // ============ archive ============
  var DREAMS = ["Build a company that outlives me","Buy my parents a house","Publish my first novel",
  "Run a sub-3 hour marathon","Ship a product to 10,000 users","Reach financial independence by 40",
  "Get my pilot's license","Open a bakery in my hometown","Speak fluent Japanese","Sail across the Atlantic",
  "Finish my PhD","Start a school in my village","Climb Kilimanjaro","Direct my first feature film",
  "Build a cabin with my own hands","Complete an Ironman","Fund a scholarship in my name",
  "Buy a house by the sea","Run a design studio of my own","Save my first million",
  "Play piano at a real recital","Cycle across the country","Launch a record label","Design a building that gets built"];
  var YRS = ["2027","2028","2029","2030","2031","2032","2033","2035"];
  var NC=3, PC=14, COUNT=NC*PC;
  var RH=[136,164,128,152,178,132,158,142,170,126,148,166,134,156], CST=[0,58,26];
  var ci = function (c,r) { return c*PC+r; };

  function block() {
    var row=document.createElement("div");
    row.style.cssText="display:flex;justify-content:center;gap:30px;width:988px";
    var cols=[];
    for (var c=0;c<NC;c++){ var w=document.createElement("div"); w.className="colWrap";
      var col=document.createElement("div"); col.className="col";
      col.style.transform="translateY("+CST[c]+"px)"; w.appendChild(col); row.appendChild(w); cols.push(col); }
    for (var c2=0;c2<NC;c2++) for (var r=0;r<PC;r++){
      var idx=ci(c2,r);
      var card=document.createElement("div"); card.className="card"; card.dataset.idx=idx;
      card.style.height=RH[r%RH.length]+"px";
      var inner=document.createElement("div"); inner.className="cardInner";
      inner.innerHTML='<div class="dream">'+DREAMS[idx%DREAMS.length]+'</div>'+
        '<div class="meta"><span class="date">'+YRS[idx%YRS.length]+
        '</span><span class="standby">standby</span></div>';
      card.appendChild(inner); cols[c2].appendChild(card);
    }
    return row;
  }
  var gi = document.getElementById("gridInner");
  var bA = block(), bB = block();
  var ld = document.createElement("div"); ld.style.height="34px";
  var gp = document.createElement("div"); gp.style.height="30px";
  gi.appendChild(ld); gi.appendChild(bA); gi.appendChild(gp); gi.appendChild(bB);
  var inA={}, inB={}, slotA={};
  bA.querySelectorAll(".card").forEach(function(c){ slotA[c.dataset.idx]=c; inA[c.dataset.idx]=c.querySelector(".cardInner"); });
  bB.querySelectorAll(".card").forEach(function(c){ inB[c.dataset.idx]=c.querySelector(".cardInner"); });
  var loopD=0;
  var canvasWrap=document.getElementById("canvasWrap"), gridLayer=document.getElementById("gridLayer");
  var hoverRing=document.getElementById("hoverRing");

  var HOVER_IDX = ci(0,3);
  // Cards turning real, each pinned to a spoken cue. The cluster at 40-45 lands on
  // "in 5 years ... most of our dreams and visions would come true".
  var FLIPS = [
    { idx: ci(0,3),  t: 26.3, y: "2029" },   // "when you do make them a reality"
    { idx: ci(2,2),  t: 40.6, y: "2027" },   // the wave under "in 5 years ... would come true"
    { idx: ci(0,7),  t: 41.3, y: "2028" },
    { idx: ci(1,9),  t: 42.0, y: "2030" },
    { idx: ci(2,6),  t: 42.7, y: "2029" },
    { idx: ci(0,11), t: 43.4, y: "2031" },
    { idx: ci(1,5),  t: 76.9, y: "2031" }    // "verify how many of these became real"
  ];
  FLIPS.forEach(function (f) {
    f.a = inA[f.idx].querySelector(".standby");
    f.b = inB[f.idx].querySelector(".standby");
  });

  // ============ cursor ============
  var cursorEl=document.getElementById("cursor"), rippleEl=document.getElementById("ripple");
  var pulseEl=document.getElementById("pulse");
  // waypoints: the pointer's whole journey
  // Every move is short and deliberate, then the pointer HOLDS at its destination
  // until the next action. Long gaps used to interpolate into a slow drift.
  var REST_A = {x:905, y:1585}, REST_B = {x:900, y:1520};
  function tapX(i) { return PAGE_L + L_X + 150; }
  // caret x at the start and end of writing a line, matching the typing override
  function capStart(i) { return lines[i].absX + 6; }
  function capEnd(i) { return lines[i].absX + WRITTEN[i].length * CHAR_W + 6; }
  var PATH = [
    {t:0.0,  x:1010, y:1770},
    {t:0.85, x:556,  y:966},                       // 0.00 "If you have a diary"
    {t:1.00, x:556,  y:966},
    {t:3.40, x:REST_A.x, y:REST_A.y},              // 4.40 "what would you write?"
    {t:4.90, x:REST_A.x, y:REST_A.y},

    var pop=0, px2=0, py2=0;
    for (var n2=0;n2<PULSES.length;n2++){
      var pd=t-PULSES[n2].t;
      if (pd>=0 && pd<1.5){
        pop=(1-pd/1.5)*0.8; px2=PULSES[n2].x; py2=PULSES[n2].y;
        pulseEl.style.transform="scale("+(0.25+pd*2.6)+")";
      }
    }
    pulseEl.style.left=px2+"px"; pulseEl.style.top=py2+"px"; fade(pulseEl,pop);
  }

  // ============ driver ============
  var st0=null, raf=null;
  function frame(now){ if(st0===null) st0=now; var t=(now-st0)/1000;
    if (t>=TOTAL){ render(TOTAL); raf=null; return; } render(t); raf=requestAnimationFrame(frame); }
  function play(){ document.getElementById("playBtn").style.display="none";
    st0=null; if(raf) cancelAnimationFrame(raf); raf=requestAnimationFrame(frame); }

  addEventListener("load", function(){
    loopD=(bB.getBoundingClientRect().top-bA.getBoundingClientRect().top)/sc;
    placeBeats();
    // measure things the pointer has to travel to
    inA[HOVER_IDX].style.opacity=1;
    HOVER_RECT=rectOf(slotA[HOVER_IDX]);
    inA[HOVER_IDX].style.opacity=0;
    compose.style.opacity=1; FIELD_RECT=rectOf(field); compose.style.opacity=0;

    // resolve the waypoints that depend on measured layout
    compose.style.opacity=1;
    var POST_RECT=rectOf(postBtn); compose.style.opacity=0;
    addBtn.style.opacity=1; var ADD_RECT=rectOf(addBtn); addBtn.style.opacity=0;

    var fy = FIELD_RECT.top + FIELD_RECT.height/2 + 16;
    var REFS = {
      hover:      { x:HOVER_RECT.left+HOVER_RECT.width-46, y:HOVER_RECT.top+HOVER_RECT.height/2 },
      dragTop:    { x:880, y:1190 },
      dragBot:    { x:880, y:790 },
      fieldStart: { x:FIELD_RECT.left+22, y:fy },
      fieldEnd:   { x:FIELD_RECT.left+22+FIELD_TXT.length*13.2, y:fy },
      add:        { x:ADD_RECT.left+ADD_RECT.width/2, y:ADD_RECT.top+ADD_RECT.height/2+14 },
      post:       { x:POST_RECT.left+POST_RECT.width/2, y:POST_RECT.top+POST_RECT.height/2+14 }
    };
    [PATH, CLICKS].forEach(function (list) {
      list.forEach(function (p) {
        if (p.ref) { p.x = REFS[p.ref].x; p.y = REFS[p.ref].y; }
      });
    });

    var q=new URLSearchParams(location.search);
    if (q.get("text")==="1") showText=true;
    render(0);
    window.__seek=function(s){ render(s); }; window.__duration=TOTAL;

    var tp=q.get("t");
    if (tp!==null && !isNaN(parseFloat(tp))){
      document.getElementById("playBtn").style.display="none"; render(parseFloat(tp)); return; }
    if (q.get("autoplay")==="1") play();
    else document.getElementById("playBtn").addEventListener("click", play);
  });
})();
</script>
