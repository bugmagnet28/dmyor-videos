</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<button id="playBtn">Play with sound</button>
<script>
// Cinematic motion engine, film "One place" (Dmyor brand reel). The page is a pure function of time: window.__seek(t).
// Look: one continuous camera (each scene becomes the next), depth blur, glow, glass UI, an organic tree. Graphite & Sage.
(function(){

var T=C.t||{}, TOTAL=C.total||40;
var cv=document.getElementById("c"), x=cv.getContext("2d"), W=1080, H=1920;

var cl=function(v){return v<0?0:v>1?1:v}, lerp=function(a,b,k){return a+(b-a)*k};

  [-W,0,W].forEach(function(o){g.beginPath();g.ellipse(cx+o,cy,rx,ry,0,0,7);g.fill();});}g.filter="none";});   // tiles horizontally, no seams

  g.beginPath();g.moveTo(X,H+10);g.quadraticCurveTo(X+(rnd()-.5)*40,base-h/2,X+(rnd()-.5)*30,base-h);g.stroke();if(rnd()<.45){var fx=X+(rnd()-.5)*30,fy=base-h;g.fillStyle=rnd()<.6?"#FFFFFF":P.pink;
  for(var k=0;k<5;k++){var a=k*1.2566;g.beginPath();g.ellipse(fx+Math.cos(a)*6,fy+Math.sin(a)*6,6,4,a,0,7);g.fill();}g.fillStyle=P.gold;g.beginPath();g.arc(fx,fy,3,0,7);g.fill();}}});

  var v=g.createRadialGradient(W/2,H/2,300,W/2,H/2,1250);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(60,45,30,.16)");g.fillStyle=v;g.fillRect(0,0,W,H);});
// ---------- scene A: dreams floating at depth ----------
var DREAMS=["Learn Spanish","Open my own studio","Run a marathon","See Japan in spring","Write a book","Buy mom a house","Learn to paint","Move to the mountains",
  "Launch my app","Play the guitar","Open a cafe","Travel solo","Finish my degree","Start a podcast","Learn to swim","Build a cabin"];
// camera flies forward through dream cards; each card is typed while it approaches, then passes the camera; new ones keep arriving

  if(al<=.01)return;x.save();x.globalAlpha=al;if(bl>.5)x.filter="blur("+bl.toFixed(1)+"px)";x.translate(W/2,1180+pass*120);x.scale(sc,sc);
  font(46,700);var w=Math.max(560,x.measureText(str).width+90),h=120;rr(-w/2,-h/2,w,h,28);x.fillStyle=hexA("#262B2F",.96);x.fill();x.strokeStyle=hexA(P.acc,.55);x.lineWidth=2.5;x.stroke();
  font(20,800);x.fillStyle=P.acc;x.textAlign="left";x.fillText("NEW DREAM",-w/2+40,-h/2-18);

function sceneA(t){x.fillStyle=P.bg;x.fillRect(0,0,W,H);
  var v=x.createRadialGradient(W/2,H*.45,100,W/2,H*.45,1200);v.addColorStop(0,"#1F2326");v.addColorStop(1,"#0E0F11");x.fillStyle=v;x.fillRect(0,0,W,H);

  x.save();x.strokeStyle=hexA(P.ink,.06);x.lineWidth=1;var gy=(t*60)%(H/10);for(var r=-1;r<11;r++){x.beginPath();x.moveTo(0,r*H/10+gy);x.lineTo(W,r*H/10+gy);x.stroke();}

  var hk=1-eio(seg(t,T.notes-.5,T.notes-.1));

  var a1=eout(seg(t,T.notes-.1,T.notes+.3))*(1-eio(seg(t,T.fade-.2,T.fade+.3)));if(a1>0)text("in your notes app",W/2,560,44,600,P.mute,a1);

  var a3=eout(seg(t,T.fade,T.fade+.4))*(1-eio(seg(t,T.turn-.2,T.turn+.2)));if(a3>0)rich([["most of them ",P.ink],["fade",P.mute]],W/2,600,64,700,a3*.9);

// ---------- scene B: the glass card on a calm sky ----------
var DREAM_TXT=C.dream||"Open my own design studio by 2028.";
function glassCard(X,Y,w,h,r,al){x.save();x.globalAlpha=al;x.shadowColor="rgba(40,50,45,.18)";x.shadowBlur=60;x.shadowOffsetY=24;rr(X,Y,w,h,r);x.fillStyle="rgba(255,255,255,.2)";x.fill();x.restore();
