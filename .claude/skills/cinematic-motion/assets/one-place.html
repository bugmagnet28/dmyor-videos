<html><head><meta charset="utf-8">

</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>

<script>
// Cinematic motion engine, film "One place" (Dmyor brand reel). The page is a pure function of time: window.__seek(t).
// Look: one continuous camera (each scene becomes the next), depth blur, glow, glass UI, an organic tree. Graphite & Sage.
(function(){
var C=/*__CONFIG__*/{};

// ---------- scene A: dreams floating at depth ----------

  var a1=eout(seg(t,T.notes-.1,T.notes+.3))*(1-eio(seg(t,T.fade-.2,T.fade+.3)));if(a1>0)text("in your notes app",W/2,560,44,600,P.mute,a1);
  var a2=eout(seg(t,T.head-.1,T.head+.3))*(1-eio(seg(t,T.fade-.2,T.fade+.3)));if(a2>0)text("in your head",W/2,630,44,600,P.mute,a2);

// ---------- scene B: the glass card on a calm sky ----------

    var n=Math.round(DREAM_TXT.length*seg(t,Math.max(T.write,T.light+.15),Math.max(T.write,T.light+.15)+1.3)),s=DREAM_TXT.slice(0,n),words=s.split(" "),l1="",l2="";
    words.forEach(function(wd){if((l1+" "+wd).length<=19&&!l2)l1=(l1?l1+" ":"")+wd;else l2=(l2?l2+" ":"")+wd;});
    text(l1,cx+56,cy+172,52,700,P.graph,1,"left");text(l2,cx+56,cy+240,52,700,P.graph,1,"left");
    if(t<Math.max(T.write,T.light+.15)+1.6&&Math.floor(t*2.4)%2===0){font(52,700);var lw=x.measureText(l2||l1).width;x.fillStyle=P.acc;x.fillRect(cx+60+lw,(l2?cy+198:cy+130),4,52);}
    var sa=eout(seg(t,T.keeps,T.keeps+.35));if(sa>0){x.save();x.globalAlpha*=sa;var sx=cx+56,sy=cy+282;rr(sx,sy,370,58,29);x.fillStyle=P.acc;x.fill();
      x.strokeStyle=P.graph;x.lineWidth=4;x.lineCap="round";x.beginPath();x.moveTo(sx+26,sy+30);x.lineTo(sx+36,sy+40);x.lineTo(sx+52,sy+20);x.stroke();

      x.beginPath();x.arc(bx+32,by+29,12,0,7);x.moveTo(bx+32,by+29);x.lineTo(bx+32,by+21);x.moveTo(bx+32,by+29);x.lineTo(bx+38,by+33);x.stroke();

// ---------- scene C: the dream grows into a tree on paper ----------
var TREE=[],TIPS=[];(function(){seed=42;var maxL=0;function br(X,Y,ang,len,wd,dep,d0){var bend=(rnd()-.5)*.5,ex=X+Math.cos(ang)*len,ey=Y+Math.sin(ang)*len;

  MPICK.forEach(function(p,i){label(p.x,p.y,MIL[i],34,eout(seg(front,p.d-20,p.d+80))*eout(seg(t,T.milestones-.3,T.milestones+.2)));});
  SPICK.forEach(function(p,i){label(p.x,p.y,STEPS[i],26,eout(seg(front,p.d-20,p.d+60))*eout(seg(t,T.steps-.4,T.steps+.1)),P.acc2,i===HI&&t>T.week);});
  text(C.dreamShort||"Open my own design studio",540,1800,34,800,P.graph,eout(seg(t,T.breakdown+.6,T.breakdown+1.2)));
  x.restore();
  var h1=eout(seg(t,T.breakdown+.6,T.breakdown+1.1))*(1-eio(seg(t,T.step1-.4,T.step1)));if(h1>0)rich([["Break it ",P.graph],["down.",P.acc]],W/2,560,72,700,h1);
  var h2=eout(seg(t,T.step1,T.step1+.5));if(h2>0)rich([["Watch it ",P.graph],["grow.",P.acc]],W/2,560,72,700,h2);
  if(fromB<1){x.save();x.globalAlpha=1-fromB;sky(t);x.restore();}}
// ---------- scene D: the promise, over the sky ----------
function sceneD(t){var k=eio(seg(t,T.close-.2,T.close+1.4));x.save();x.translate(0,(1-k)*-H);sky(t,0);x.restore();
  for(var i=0;i<14;i++){var px=(i*137+t*40*(1+i%3*.3))%(W+100)-50,py=(i*311+t*(60+i*7))%H;x.save();x.globalAlpha=.7;x.translate(px,py);x.rotate(t+i);x.fillStyle=i%2?P.pink:"#FFFFFF";x.beginPath();x.ellipse(0,0,9,5,0,0,7);x.fill();x.restore();}
  var L=[[[["Archive your dream ",P.graph],["today.",P.acc]],T.archive],[[["See it ",P.graph],["tomorrow.",P.acc]],T.tomorrow],[[["Break it into ",P.graph],["small steps.",P.acc]],T.breakit]];
  var outk=eio(seg(t,T.link-.4,T.link+.2));L.forEach(function(l,i){var a=eout(seg(t,l[1]-.15,l[1]+.35));if(a>0)rich(l[0],W/2,700+i*110+(1-a)*20,62,700,a*(1-outk));});}
// ---------- scene E: wordmark built on a grid ----------
function sceneE(t){var k=seg(t,T.link-.3,T.link+.5);x.drawImage(PAPER,0,0);x.save();x.globalAlpha=1-eio(k);sceneD(t);x.restore();
  var g=eout(seg(t,T.link,T.link+1));x.save();x.strokeStyle=hexA(P.graph,.12*g);x.lineWidth=1.5;for(var i=-3;i<=3;i++){x.beginPath();x.moveTo(W/2+i*110,700);x.lineTo(W/2+i*110,1180);x.stroke();}
  x.beginPath();x.moveTo(140,860);x.lineTo(940,860);x.moveTo(140,1010);x.lineTo(940,1010);x.stroke();
  [[-220,935],[0,935],[220,935]].forEach(function(c,j){x.beginPath();x.arc(W/2+c[0],c[1],95*eout(seg(t,T.link+.1+j*.12,T.link+.7+j*.12)),0,7);x.stroke();});x.restore();
  var word="dmyor";font(190,900);var tot=x.measureText(word).width,cx=W/2-tot/2;
  for(var j=0;j<word.length;j++){var ch=word[j],a=eout(seg(t,T.link+.35+j*.09,T.link+.85+j*.09));font(190,900);var w=x.measureText(ch).width;
    x.save();x.globalAlpha=a;x.fillStyle=P.graph;x.fillText(ch,cx,1000+(1-a)*40);x.restore();cx+=w;}
  text("One place for your dreams.",W/2,1120,46,600,P.mute,eout(seg(t,T.link+1.1,T.link+1.6)));
  var h=eout(seg(t,T.link+1.5,T.link+2));if(h>0){x.save();x.globalAlpha=h;font(40,700);var hw=x.measureText(C.handle||"@becauseidmyor").width+64;rr(W/2-hw/2,1190,hw,72,36);x.fillStyle=P.acc;x.fill();
    text(C.handle||"@becauseidmyor",W/2,1238,40,700,P.graph);x.restore();}}
// ---------- the one continuous timeline ----------
function render(t){t=Math.max(0,Math.min(TOTAL,t));x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.filter="none";
  if(t<T.ring)sceneA(t);
  else if(t<T.light){tunnel(t);}
  else if(t<T.breakdown+.75){var o=sceneB(t);}
  else if(t<T.close-.2){var fb=eio(seg(t,T.breakdown+.5,T.breakdown+1.1));sceneC(t,fb);if(fb<1){x.save();x.globalAlpha=(1-fb);glow(W/2,1670,140,P.acc,.6);x.restore();}}
  else if(t<T.close+1.4){var k=eio(seg(t,T.close-.2,T.close+1.4));sceneD(t);x.save();x.translate(0,k*H);sceneCtree(t);x.restore();
    var sg=x.createLinearGradient(0,k*H-260,0,k*H+60);sg.addColorStop(0,hexA(P.paper,0));sg.addColorStop(.8,hexA(P.paper,1));x.fillStyle=sg;x.fillRect(0,k*H-260,W,320);}   // camera tilts up: tree out below, sky in from above
  else if(t<T.link-.3)sceneD(t);
  else sceneE(t);
  var fl=t<T.light?ein(seg(t,T.light-.35,T.light)):1-eout(seg(t,T.light,T.light+.5));if(fl>0){x.fillStyle='rgba(255,255,255,'+(fl*.9)+')';x.fillRect(0,0,W,H);}}
function sceneCtree(t){x.save();x.drawImage(PAPER,0,0);var front=TREE.maxL;TREE.forEach(function(s){var n=10;x.strokeStyle=P.bark;x.lineCap="round";for(var i=0;i<n;i++){var a=qpt(s,i/n),b=qpt(s,(i+1)/n);x.lineWidth=lerp(s.w0,s.w1,i/n);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();}});
  LEAVES.forEach(function(l){x.save();x.translate(l.x,l.y);x.rotate(l.a);x.scale(l.s,l.s);if(l.bl){x.fillStyle=P.pink;for(var k=0;k<5;k++){x.beginPath();x.ellipse(Math.cos(k*1.2566)*9,Math.sin(k*1.2566)*9,9,6,k*1.2566,0,7);x.fill();}}else{x.fillStyle=P.leaf;x.beginPath();x.ellipse(0,0,16,7,0,0,7);x.fill();}x.restore();});
  MPICK.forEach(function(p,i){label(p.x,p.y,MIL[i],34,1);});SPICK.forEach(function(p,i){label(p.x,p.y,STEPS[i],26,1,P.acc2,i===HI);});x.restore();}
var FONTS=Promise.all([500,600,700,800,900].map(function(w){return document.fonts.load(w+' 40px Tight');}));
window.__duration=TOTAL;window.__seek=function(t){return FONTS.then(function(){render(t);});};
FONTS.then(function(){render(0);});
document.getElementById("playBtn").onclick=function(){this.style.display="none";var a=new Audio("audio_mixed.mp3");a.play().catch(function(){});var t0=performance.now();
  (function loop(){var t=(performance.now()-t0)/1000;render(t);if(t<TOTAL)requestAnimationFrame(loop);})();};
})();
