<!doctype html>
<html><head><meta charset="utf-8"><title>dmyor animated illustration</title>
<style>
/* Animated illustration explainer: every spoken thought gets an animated vector SCENE that depicts it
   (objects draw on, pop, move, transform), with a short headline on top. Brand: dark canvas, white line
   art, orange accent. Pure function of time: window.__seek(t). Scenes live in the SCENES registry. */
@font-face{font-family:"Tight";font-weight:600;src:url(fonts/InterTight-normal-600.woff2)}
@font-face{font-family:"Tight";font-weight:700;src:url(fonts/InterTight-normal-700.woff2)}
@font-face{font-family:"Tight";font-weight:800;src:url(fonts/InterTight-normal-800.woff2)}
@font-face{font-family:"Tight";font-weight:900;src:url(fonts/InterTight-normal-900.woff2)}
html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#151719;font-family:"Tight",sans-serif;color:#E9E7E2;-webkit-font-smoothing:antialiased;transform-origin:center}
svg{position:absolute;inset:0}
.head{position:absolute;left:80px;right:80px;top:250px;text-align:center;font-weight:800;font-size:66px;line-height:1.12;letter-spacing:-1px;font-weight:700;opacity:0}
.head b{color:#9DB8A3;font-weight:900}
#corner{position:absolute;left:64px;top:96px;font-weight:700;font-size:20px;letter-spacing:4px;color:#5C605B}
#bar{position:absolute;left:0;bottom:0;height:6px;background:#9DB8A3;width:0}
#brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;padding-bottom:220px;box-sizing:border-box}
#brand .mark{font-weight:900;font-size:160px;letter-spacing:-6px;line-height:1}
#brand .tag2{white-space:pre-line;font-weight:600;font-size:52px;color:#8C8F8A;margin-top:26px;line-height:1.2}
#brand .handle{margin-top:48px;font-weight:700;font-size:40px;padding:14px 36px;border-radius:999px;background:#9DB8A3;color:#151719}
#playBtn{position:fixed;inset:0;margin:auto;width:210px;height:64px;border-radius:32px;border:0;font:700 22px sans-serif;cursor:pointer}
</style></head><body>
<div id="viewport"><div id="stage">
  <svg id="bg" width="1080" height="1920"><defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" fill-opacity=".05"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#9DB8A3" stop-opacity=".22"/><stop offset="1" stop-color="#9DB8A3" stop-opacity="0"/></radialGradient></defs>
    <rect id="gridrect" x="0" y="-40" width="1080" height="2000" fill="url(#dots)"/><circle id="glowc" cx="540" cy="1080" r="560" fill="url(#glow)"/></svg>
  <svg id="scene" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="heads"></div>
  <div id="corner">DMYOR</div><div id="bar"></div>
  <div id="brand"><div class="mark">dmyor</div><div class="tag2"></div><div class="handle"></div></div>
</div></div>
<button id="playBtn">PLAY</button>
<script>
var CFG = /*__CONFIG__*/{};
</script>
<script>
(function(){
"use strict";
var W=1080,H=1920,C=CFG,T=C.total,NS="http://www.w3.org/2000/svg";
var stage=document.getElementById("stage"),root=document.getElementById("scene");
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform="scale("+s+")";}fit();addEventListener("resize",fit);
// ---------- easing / time helpers ----------
var cl=function(x){return x<0?0:x>1?1:x},seg=function(t,a,b){return cl((t-a)/(b-a))};
var eout=function(x){return 1-Math.pow(1-x,3)},eio=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
var lerp=function(a,b,k){return a+(b-a)*k};
var PAL=Object.assign({"bg": "#151719", "ink": "#E9E7E2", "mute": "#8C8F8A", "acc": "#9DB8A3", "acc2": "#D8CBA8", "warn": "#C98B7B", "ok": "#9DB8A3", "panel": "#1D2023", "line": "#33373B", "paper": "#E9E7E2", "paperInk": "#151719", "onAcc": "#151719"},C.palette||{});
var INK=PAL.ink,MUTE=PAL.mute,ACC=PAL.acc,RED=PAL.warn,GREEN=PAL.ok,PANEL=PAL.panel,LINE=PAL.line;
(function(){var st=document.getElementById("stage");st.style.background=PAL.bg;st.style.color=PAL.ink;
  var css=document.createElement("style");css.textContent=".head b{color:"+PAL.acc+"} #bar{background:"+PAL.acc+"} #brand .handle{background:"+PAL.acc+";color:"+PAL.onAcc+"} #brand .tag2{color:"+PAL.mute+"} #corner{color:"+PAL.mute+"}";document.head.appendChild(css);
  document.querySelector("#glow stop").setAttribute("stop-color",PAL.acc);document.querySelectorAll("#glow stop")[1].setAttribute("stop-color",PAL.acc);
  document.querySelector("#dots circle").setAttribute("fill",PAL.ink);})();
function el(tag,a,p){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);(p||root).appendChild(e);return e;}
function g(p,a){return el("g",a||{},p);}
function txt(p,s,x,y,size,col,weight,anchor){var e=el("text",{x:x,y:y,"font-size":size,fill:col||INK,"font-family":"Tight","font-weight":weight||800,"text-anchor":anchor||"middle"},p);e.textContent=s;return e;}
function draw(e){var L=e.getTotalLength?e.getTotalLength():1000;e.setAttribute("stroke-dasharray",L);e.setAttribute("stroke-dashoffset",L);e.__L=L;return e;}
function drawTo(e,k){e.setAttribute("stroke-dashoffset",e.__L*(1-cl(k)));}
function tr(e,x,y,s,r,o){e.setAttribute("transform","translate("+x+","+y+") scale("+(s==null?1:s)+")"+(r?" rotate("+r+")":""));if(o!=null)e.setAttribute("opacity",o);}
// ---------- reusable pieces (refined line art: thin strokes, rounded caps, no cartoon effects) ----------
var SW=5;
function person(p,col){var G=g(p);el("circle",{cx:0,cy:-118,r:16,fill:"none",stroke:col||INK,"stroke-width":SW},G);
  el("path",{d:"M0 -100 L0 -46 M0 -86 L-24 -62 M0 -86 L24 -64 M0 -46 L-18 0 M0 -46 L18 0",stroke:col||INK,"stroke-width":SW,"stroke-linecap":"round",fill:"none"},G);return G;}
function card(p,w,h,label,opt){opt=opt||{};var G=g(p);el("rect",{x:-w/2,y:-h/2,width:w,height:h,rx:14,fill:opt.fill||PANEL,stroke:opt.stroke||LINE,"stroke-width":opt.sw||3},G);
  if(label)txt(G,label,0,opt.size?opt.size*.35:12,opt.size||34,opt.col||INK,opt.w||700);return G;}
function check(p,col){return draw(el("path",{d:"M-18 0 L-5 13 L20 -14",stroke:col||ACC,"stroke-width":6,"stroke-linecap":"round","stroke-linejoin":"round",fill:"none"},p));}
function label(p,s,size,col){return txt(p,s,0,0,size||30,col||MUTE,700);}
var drift=function(t,a){return (a||4)*Math.sin(t*.9);};
// ---------- SCENES: function(group, params) -> render(k, t) ; t = seconds since the scene started ----------
var SCENES={
  "gauge-vs-goal":function(p,P){var G=g(p);
    var gauge=g(G);el("rect",{x:-46,y:-300,width:92,height:420,rx:46,fill:"none",stroke:LINE,"stroke-width":4},gauge);var fillr=el("rect",{x:-34,y:108,width:68,height:0,rx:34,fill:ACC},gauge);
    var pc=txt(gauge,"0%",0,-330,44,INK,800);var gl=txt(gauge,P.left||"Motivation",0,180,30,MUTE,700);
    var goal=g(G);var gr=el("rect",{x:-170,y:0,width:340,height:0,rx:16,fill:PANEL,stroke:LINE,"stroke-width":3},goal);var gt=txt(goal,P.right||"The goal",0,0,40,INK,800);
    var me=person(G,MUTE);
    return function(k,t){var f=eio(seg(t,.1,1.3));fillr.setAttribute("y",108-388*f);fillr.setAttribute("height",388*f);pc.textContent=Math.round(100*f)+"%";
      tr(gauge,300,1250,1,0,eout(seg(t,0,.5)));var h=lerp(120,820,eio(seg(t,.4,3.2)));gr.setAttribute("y",-h);gr.setAttribute("height",h);gt.setAttribute("y",-h+70);
      tr(goal,720,1600+drift(t,2),1,0,eout(seg(t,.2,.7)));tr(me,520,1600,1,0,eout(seg(t,.5,1)));};},
  "postpone-calendar":function(p,P){var G=g(p);var days=P.days||["MON","TUE","WED","THU","FRI"];
    var base=g(G);el("rect",{x:-230,y:-250,width:460,height:500,rx:24,fill:PANEL,stroke:LINE,"stroke-width":3},base);el("rect",{x:-230,y:-250,width:460,height:86,rx:24,fill:ACC},base);
    el("circle",{cx:-120,cy:-250,r:12,fill:INK},base);el("circle",{cx:120,cy:-250,r:12,fill:INK},base);
    var day=txt(base,days[0],0,-190,44,PAL.onAcc,800);var big=txt(base,"",0,40,150,INK,800);var note=txt(base,P.note||"start tomorrow",0,170,34,MUTE,700);
    var strike=el("line",{x1:-150,x2:150,y1:160,y2:160,stroke:RED,"stroke-width":4,"stroke-linecap":"round"},base);draw(strike);
    return function(k,t){tr(base,540,1150,1,0,eout(seg(t,0,.4)));var per=.9,i=Math.min(days.length-1,Math.floor(Math.max(0,t-.2)/per)),ph=((Math.max(0,t-.2))%per)/per;
      day.textContent=days[i];big.textContent=String(20+i);var flip=i<days.length-1?eio(seg(ph,.75,1)):0;big.setAttribute("transform","translate(0,40) scale(1,"+(1-flip*.9)+") translate(0,-40)");
      drawTo(strike,seg(ph,.35,.65));strike.setAttribute("opacity",1-seg(ph,.8,1));};},
  "book-vs-evening":function(p,P){var G=g(p);var bk=g(G);
    for(var i=6;i>=0;i--)el("rect",{x:-200+i*6,y:-260+i*6,width:340,height:460,rx:12,fill:i?PANEL:PAL.panel,stroke:LINE,"stroke-width":3},bk);
    el("line",{x1:-150,x2:80,y1:-170,y2:-170,stroke:ACC,"stroke-width":5,"stroke-linecap":"round"},bk);var pg=txt(bk,"0",-30,40,96,INK,800);txt(bk,"pages",-30,100,32,MUTE,700);
    var clk=g(G);el("circle",{r:110,fill:"none",stroke:LINE,"stroke-width":4},clk);var hh=el("line",{x1:0,y1:0,x2:0,y2:-56,stroke:INK,"stroke-width":7,"stroke-linecap":"round"},clk);
    var mh=el("line",{x1:0,y1:0,x2:0,y2:-86,stroke:ACC,"stroke-width":4,"stroke-linecap":"round"},clk);txt(clk,P.when||"Tuesday, 9 PM",0,170,30,MUTE,700);
    return function(k,t){tr(bk,430,1170,1,0,eout(seg(t,0,.5)));pg.textContent=Math.round((P.pages||300)*eio(seg(t,.3,1.8)));
      tr(clk,820,1520,1,0,eout(seg(t,.6,1.1)));var m=t*40;mh.setAttribute("transform","rotate("+m+")");hh.setAttribute("transform","rotate("+(270+m/12)+")");};},
  "book-breakdown":function(p,P){var G=g(p);var items=P.items||["Chapter 1 outline","5 key points","First scene"];
    var bk=g(G);el("rect",{x:-150,y:-200,width:300,height:400,rx:12,fill:PANEL,stroke:LINE,"stroke-width":3},bk);txt(bk,P.book||"The book",0,10,36,INK,800);
    var rows=items.map(function(it,i){var R=g(G);var c=card(R,520,96,"",{stroke:LINE});var tx=txt(R,it,-200,12,32,INK,700,"start");var ck=check(R);tr(ck,210,0);
      var ln=draw(el("path",{d:"M-270 0 L-330 0",stroke:LINE,"stroke-width":3},R));return {R:R,ck:ck,ln:ln};});
    var ctr=g(G);card(ctr,520,150,"",{stroke:ACC,sw:3});var num=txt(ctr,"0",-150,22,64,ACC,800);txt(ctr,P.unit||"words / day",70,20,34,INK,700);
    return function(k,t){var sh=eio(seg(t,.2,.9));tr(bk,lerp(540,250,sh),1180,lerp(1,.62,sh),0,1);
      rows.forEach(function(r,i){var a=.8+i*.45,pp=eout(seg(t,a,a+.5));tr(r.R,lerp(780,700,pp),980+i*130,1,0,pp);drawTo(r.ck,seg(t,a+.4,a+.8));});
      var c=eout(seg(t,2.4,2.9));tr(ctr,620,1470,1,0,c);num.textContent=Math.round((P.per||300)*eio(seg(t,2.6,3.6)));};},
  "week-tracker":function(p,P){var G=g(p);var D=["M","T","W","T","F","S","S"],on=P.on||[0,2,4];
    var cells=D.map(function(d,i){var C2=g(G);el("rect",{x:-56,y:-56,width:112,height:112,rx:20,fill:on.indexOf(i)>=0?PANEL:"none",stroke:on.indexOf(i)>=0?ACC:MUTE,"stroke-opacity":on.indexOf(i)>=0?1:.45,"stroke-width":3},C2);
      txt(C2,d,0,-80,30,MUTE,700);var ck=on.indexOf(i)>=0?check(C2):null;return {C:C2,ck:ck};});
    var me=person(G,INK);var path=draw(el("line",{x1:160,x2:920,y1:1600,y2:1600,stroke:LINE,"stroke-width":3,"stroke-linecap":"round"},G));
    var dur=g(G);card(dur,260,96,P.what||"30 min walk",{stroke:LINE,size:32});
    return function(k,t){cells.forEach(function(c,i){tr(c.C,150+i*130,1160,1,0,eout(seg(t,i*.08,.4+i*.08)));if(c.ck)drawTo(c.ck,seg(t,.8+on.indexOf(i)*.5,1.2+on.indexOf(i)*.5));});
      drawTo(path,seg(t,.3,1.2));var w=seg(t,.6,4.5);tr(me,lerp(200,860,w),1600,1,0,eout(seg(t,.4,.8)));tr(dur,540,1330,1,0,eout(seg(t,1.2,1.7)));};},
  "fifteen-test":function(p,P){var G=g(p);var lim=P.minutes||15;
    var tm=g(G);el("circle",{r:150,fill:"none",stroke:LINE,"stroke-width":9},tm);var arc=el("path",{d:"",fill:"none",stroke:ACC,"stroke-width":9,"stroke-linecap":"round"},tm);
    var mk=el("line",{x1:0,y1:-165,x2:0,y2:-135,stroke:INK,"stroke-width":5},tm);var mins=txt(tm,"0 min",0,20,56,INK,800);var verdict=txt(tm,"",0,215,32,MUTE,700);
    var step=g(G);card(step,600,130,P.step||"First step",{size:40,stroke:LINE});
    var parts=[0,1,2].map(function(i){var R=g(G);card(R,180,120,P.parts?P.parts[i]:"",{size:26,stroke:ACC});var c=check(R);tr(c,0,95);return {R:R,c:c};});
    return function(k,t){var over=P.over||40,small=P.small||10;var sp=eio(seg(t,2.6,3.4));
      var m=t<2.6?lerp(0,over,eio(seg(t,.3,2.2))):lerp(0,small,eio(seg(t,3.4,4.6)));var ang=m/60*360,a=(ang-90)*Math.PI/180;
      arc.setAttribute("d",ang<1?"":"M0 -150 A150 150 0 "+(ang>180?1:0)+" 1 "+(150*Math.cos(a))+" "+(150*Math.sin(a)));arc.setAttribute("stroke",m>lim?RED:ACC);
      mk.setAttribute("transform","rotate("+lim*6+")");mins.textContent=Math.round(m)+" min";mins.setAttribute("fill",m>lim?RED:INK);
      verdict.textContent=t<2.6?(m>lim?"too big":""):(t>4.6?"start now":"");verdict.setAttribute("fill",t<2.6?RED:ACC);
      tr(tm,540,960,1,0,eout(seg(t,0,.4)));
      tr(step,540,1430,1,0,eout(seg(t,.2,.6))*(1-sp));parts.forEach(function(r,i){tr(r.R,lerp(540,320+i*220,sp),1430,1,0,sp);drawTo(r.c,seg(t,4.7+i*.3,5+i*.3));});};},
  "dream-to-steps":function(p,P){var G=g(p);var steps=P.steps||["Outline chapter 1","300 words a day","Walk 30 min"];
    var arch=g(G);el("rect",{x:-260,y:-110,width:520,height:220,rx:20,fill:PANEL,stroke:ACC,"stroke-width":3},arch);
    txt(arch,P.tag||"ARCHIVED TODAY",-220,-56,22,ACC,800,"start");txt(arch,P.dream||"Write my first book",-220,10,44,INK,800,"start");txt(arch,P.date||"Open it again: Oct 2027",-220,62,26,MUTE,700,"start");
    var lines=steps.map(function(_,i){return draw(el("path",{d:"M540 1060 C540 1160, "+(260+i*280)+" 1160, "+(260+i*280)+" 1260",stroke:LINE,"stroke-width":3,fill:"none"},G));});
    var cards=steps.map(function(st,i){var R=g(G);card(R,250,120,"",{stroke:LINE});var words=st.split(" "),cut=words.length,best=1e9;if(st.length>14)for(var j=1;j<words.length;j++){var d=Math.abs(words.slice(0,j).join(" ").length-words.slice(j).join(" ").length);if(d<best){best=d;cut=j;}}
      var l1=words.slice(0,cut).join(" "),l2=words.slice(cut).join(" ");
      txt(R,l1,0,l2?-6:10,28,INK,700);if(l2)txt(R,l2,0,30,28,INK,700);var c=check(R);tr(c,0,100);return {R:R,c:c};});
    return function(k,t){tr(arch,540,940,1,0,eout(seg(t,0,.6)));lines.forEach(function(l,i){drawTo(l,seg(t,1.2+i*.25,1.9+i*.25));});
      cards.forEach(function(o,i){var pp=eout(seg(t,1.7+i*.25,2.2+i*.25));tr(o.R,260+i*280,1330,1,0,pp);drawTo(o.c,seg(t,3+i*.5,3.4+i*.5));});};},
  "proof-to-motivation":function(p,P){var G=g(p);var n=8,tiles=[];for(var i=0;i<n;i++){var T2=g(G);el("rect",{x:-40,y:-40,width:80,height:80,rx:16,fill:PANEL,stroke:ACC,"stroke-width":3},T2);tiles.push({T:T2,ck:check(T2)});}
    var ax=draw(el("path",{d:"M180 1600 L180 960 M180 1600 L940 1600",stroke:LINE,"stroke-width":3,fill:"none"},G));
    var ln=draw(el("path",{d:"M180 1560 C 400 1520, 560 1380, 700 1220 S 880 1000, 930 960",stroke:ACC,"stroke-width":6,fill:"none","stroke-linecap":"round"},G));
    var lab=g(G);var l1=txt(lab,P.a||"proof",0,0,46,MUTE,800);var l2=txt(lab,P.b||"motivation",0,0,46,ACC,800);
    return function(k,t){drawTo(ax,seg(t,0,.6));tiles.forEach(function(o,i){var a=.3+i*.22,pp=eout(seg(t,a,a+.4));tr(o.T,230+i*95,1500-i*62,.8,0,pp);drawTo(o.ck,seg(t,a+.2,a+.5));});
      drawTo(ln,seg(t,1.6,3));var sw=eio(seg(t,3,3.6));tr(lab,780,900,1);l1.setAttribute("opacity",1-sw);l2.setAttribute("opacity",sw);};}
};
// ---------- build scenes on the timeline ----------
var built=C.scenes.map(function(sc){var G=g(root);var fn=(SCENES[sc.type]||SCENES["gauge-vs-goal"])(G,sc.params||{});
  var hd=document.createElement("div");hd.className="head";hd.innerHTML=sc.head||"";document.getElementById("heads").appendChild(hd);return {sc:sc,G:G,fn:fn,hd:hd};});
var brand=document.getElementById("brand");brand.querySelector(".tag2").textContent=C.tagline;brand.querySelector(".handle").textContent=C.handle;
var gridrect=document.getElementById("gridrect"),glowc=document.getElementById("glowc"),bar=document.getElementById("bar");
function render(t){t=Math.max(0,Math.min(T,t));gridrect.setAttribute("y",-40+(t*4)%40);glowc.setAttribute("r",560);
  built.forEach(function(b,i){var s=b.sc,first=i===0,on=t>=s.t0-.05&&t<s.t1+.35;b.G.style.display=on?"":"none";b.hd.style.display=on?"":"none";if(!on)return;
    var vin=first?1:eio(seg(t,s.t0,s.t0+.45)),vout=1-eio(seg(t,s.t1-.05,s.t1+.4));
    b.G.setAttribute("opacity",vin*vout);b.G.setAttribute("transform","translate(0,"+(36*(1-vin)-36*(1-vout))+")");
    var lt=first?Math.max(t,0)+(s.pre||4):t-s.t0;   // the hook scene is already "finished" on frame 0
    b.fn(seg(t,s.t0,s.t1),lt);
    var hv=first?1:eout(seg(t,s.t0+.05,s.t0+.35));b.hd.style.opacity=hv*vout;b.hd.style.transform="translateY("+(12*(1-hv))+"px)";});
  bar.style.width=(100*t/T)+"%";var pb=eio(seg(t,C.brandT,C.brandT+.4));brand.style.opacity=pb;brand.style.transform="scale("+(.96+.04*pb)+")";
  root.style.opacity=1-pb;document.getElementById("heads").style.opacity=1-pb;}
window.__duration=T;window.__seek=function(t){render(t);};render(0);
var playing=false,t0=0;document.getElementById("playBtn").onclick=function(){this.style.display="none";t0=performance.now();playing=true;var a=new Audio("audio_mixed.mp3");a.play().catch(function(){});
  (function loop(){if(!playing)return;var t=(performance.now()-t0)/1000;render(t);if(t<T)requestAnimationFrame(loop);})();};
})();
</script>
