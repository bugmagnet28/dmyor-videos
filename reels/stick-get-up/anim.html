<script>
// "Get Up": wordless stick-figure choice reel. Silent render, every move sits on a 120 BPM grid (beat = 0.5 s)

(function () {

function hash(n) { var s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }

// ---------- boiling ink ----------
function ink(pts, w, col, closed, fill, amp) {

function circ(cx, cy, rx, ry, a0, a1, n) { var o = []; a0 = a0 || 0; a1 = a1 == null ? Math.PI * 2 : a1; n = n || 26; var full = Math.abs(a1 - a0) >= Math.PI * 2 - 1e-6;

function box(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
function ln(x1, y1, x2, y2, w, col, amp) { ink([[x1, y1], [x2, y2]], w, col, false, null, amp); }
function txt(s, x, y, size, col, align, font) { X.font = size + "px " + (font || "Marker"); X.fillStyle = col || INK; X.textAlign = align || "center"; X.textBaseline = "middle";

// a hand-drawn sign; o: fill, ink, alpha, sc, rot, half (-1 left / 1 right piece of a cracked sign)

// ---------- stick figure rig (absolute limb angles; 0 = straight down, + = toward screen right) ----------

  ink([o(hip), o(neck)], lw);

  if (p.bar > .5) { var a = o(haL), b = o(haR), dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;

    [[a, -1], [b, 1]].forEach(function (q) { var c = [q[0][0] + ux * 70 * q[1], q[0][1] + uy * 70 * q[1]]; ink(circ(c[0], c[1], 12 * S, 34 * S), lw * .7, INK, true, INK); }); }

// face: lid (0 shut .. 1 open .. 1.3 wide), brow (-1 angry .. 1 worried), squeeze, smile, vein, look, m (maturity), band
function face(cx, cy, R, ex, rot) {

  var m = ex.m || 0, lw = R * .085, lk = (ex.look || 0) * R * .12;
  if (m > .3) { var bk = sm(m, .3, .75), pts = []; for (var i = 0; i <= 18; i++) { var a = rad(22 + 136 * i / 18), r = R * (i % 2 ? 1.0 + .16 * bk : .95); pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
    X.globalAlpha = .35 + .65 * bk; ink(pts, lw * .9, INK, false, null, 1); X.globalAlpha = 1;
    if (m > .55) { X.globalAlpha = sm(m, .55, .85); ink([[-R * .22, R * .36], [-R * .05, R * .3], [R * .05, R * .3], [R * .22, R * .36]], lw * .8, INK, false, null, .8); X.globalAlpha = 1; } }

      if (ex.lid < .7) { X.lineWidth = lw * .8; X.strokeStyle = INK; X.beginPath(); X.moveTo(ex0 - R * .14, ey - R * .15 * lid); X.lineTo(ex0 + R * .14, ey - R * .15 * lid); X.stroke(); }

  if (ex.vein > 0) { X.save(); X.translate(R * .62, -R * .62); X.scale(ex.vein, ex.vein); [0, 1, 2, 3].forEach(function (q) { X.save(); X.rotate(q * Math.PI / 2); ink(circ(R * .2, R * .2, R * .12, R * .12, Math.PI, Math.PI * 1.5, 5), R * .07, ACC, false, null, .5); X.restore(); }); X.restore(); }

// ---------- camera ----------
function camApply(c) { X.translate(W / 2 + (c.sx || 0), H / 2 + (c.sy || 0)); X.scale(c.z, c.z); X.translate(-c.x, -c.y); }
function camLerp(a, b, k) { return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k) }; }

// ---------- paper ----------
function paper() {
  X.fillStyle = PAPER; X.fillRect(0, 0, W, H);
  X.fillStyle = INK; for (var i = 0; i < 420; i++) { X.globalAlpha = .035 + .03 * hash(i * 3); X.fillRect(hash(i) * W, hash(i + 99) * H, 2 + hash(i + 7) * 2, 2); } X.globalAlpha = 1;
}
function vignette() { var g = X.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0," + (.16 + .14 * NK) + ")"); X.fillStyle = g; X.fillRect(0, 0, W, H); }

// =====================================================================
// PART 1 (0-10 s): the bedroom. Alarm, slap, the drift back, the snap.
// =====================================================================
var HEAD = [760, 1032];
function lidAt(t) { var K = [[3.8, 0], [4.25, .45], [5.1, .22], [5.5, .58], [6.3, .18], [6.7, .4], [7.5, .07], [8.0, 0], [8.5, 0], [8.56, 1.3], [9.2, 1.1]]; if (t <= K[0][0]) return 0;
  for (var i = 1; i < K.length; i++) if (t < K[i][0]) return lerp(K[i - 1][1], K[i][1], eio(seg(t, K[i - 1][0], K[i][0]))); return 1.1; }
function partBed(t) {

  var c = { x: 770, y: 1000, z: 1.6 };
  if (t < 4) c = camLerp({ x: 850, y: 960, z: 1.4 }, { x: 600, y: 990, z: 1.1 }, eio(seg(t, 1.0, 4)));
  else if (t < 4.7) c = camLerp({ x: 600, y: 990, z: 1.1 }, { x: 760, y: 1032, z: 2.0 }, eio(seg(t, 4, 4.7)));
  else if (t < 8.5) c = camLerp({ x: 760, y: 1032, z: 2.0 }, { x: 760, y: 1036, z: 2.3 }, seg(t, 4.7, 8.5));
  else if (t < 9.1) c = { x: 760, y: 1036, z: 2.55 };
  else if (t < 9.6) c = camLerp({ x: 760, y: 1036, z: 2.55 }, { x: 600, y: 1040, z: 1.2 }, eio(seg(t, 9.1, 9.6)));

  // blanket

  X.save(); X.translate(-380 * fk, -1100 * fk); X.translate(420, 1100); X.rotate(-.7 * fk); X.translate(-420, -1100);
  var blank = mix(mixh("#3A4064", "#E2D6BE", 1 - NK), INK, .0);

  ink([[600, 1060], [560, 1150]], 5, INK, false, null, 1.5); ink([[420, 1066], [440, 1160]], 5, INK, false, null, 1.5); ink([[250, 1060], [230, 1150]], 5, INK, false, null, 1.5);
  X.restore();

  ink(box(930, 1120, 150, 180), 8, INK, true, PAPER); ln(930, 1190, 1080, 1190, 6); ink(circ(1005, 1158, 7, 7), 5);
  var ring = t < 2.6, cs = ring ? shk(9, 7) : [0, 0, 0], sq = 1 - .18 * Math.sin(Math.PI * seg(t, 2.6, 2.85));
