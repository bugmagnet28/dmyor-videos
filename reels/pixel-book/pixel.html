<!doctype html>
<html><head><meta charset="utf-8"><title>Pixel Book</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1080px;height:1920px;image-rendering:pixelated}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Pixel Book: every frame is a pure function of time. Worlds are drawn at 270x480 (1 art pixel = 4 screen px)
// and blitted with a nearest-neighbour "pixel camera", so zooming makes the pixels bigger, never blurry.
var W = 270, H = 480, OW = 1080, OH = 1920, DUR = 158.5;
var C = document.getElementById("c"), X = C.getContext("2d"); X.imageSmoothingEnabled = false;
function mk(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; var x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; }
var LB = mk(W, H), OA = mk(OW, OH), OB = mk(OW, OH), TINY = mk(W, H);

// ---------- assets ----------
var A = {}, LIST = {
  sky: "art/field/sky.png", clouds: "art/field/clouds.png", far: "art/field/far.png", mid: "art/field/mid.png", ground: "art/field/ground.png",
  shadow: "art/field/shadow.png", flowers: "art/field/flowers.png", tree: "art/field/tree.png", reader: "art/field/hero_read.png", reader_blink: "art/field/hero_read_blink.png", book_ground: "art/field/book_ground.png",
  house: "art/scenes/house.png", hedge: "art/scenes/hedge.png", car: "art/scenes/car.png", wheel0: "art/scenes/wheel0.png", wheel1: "art/scenes/wheel1.png",
  room_night: "art/scenes/room_night.png", room_dawn: "art/scenes/room_dawn.png", notebook: "art/scenes/notebook.png", laptop: "art/scenes/laptop.png",
  alarm0: "art/scenes/alarm0.png", alarm1: "art/scenes/alarm1.png", phone: "art/scenes/phone.png", friendcar: "art/scenes/friendcar.png",
  shop: "art/scenes/shop.png", sign0: "art/scenes/sign0.png", sign1: "art/scenes/sign1.png", office: "art/scenes/office.png", library: "art/scenes/library.png", bigbook: "art/scenes/bigbook.png"
};
["stand", "blink", "shock", "walk0", "walk1", "walk2", "walk3", "owalk0", "owalk1", "owalk2", "owalk3", "ostand", "olook", "sit_write0", "sit_write1", "sit_type0", "sit_type1",
 "sit_bed", "sit_bed_blink", "stretch", "wave_off", "sad", "sad_blink", "shake0", "shake1", "cshake0", "cshake1", "crouch", "jump", "lookup", "bed_phone", "bed_yawn", "bed_phone_blink"].forEach(function (n) { LIST["c_" + n] = "art/chars/" + n + ".png"; });
var READY = Promise.all(Object.keys(LIST).map(function (k) { return new Promise(function (res) { var i = new Image(); i.onload = function () { A[k] = i; res(); }; i.onerror = function () { console.error("missing " + LIST[k]); res(); }; i.src = LIST[k]; }); }));

// ---------- math ----------
function cl(v, a, b) { return Math.max(a, Math.min(b, v)); }
function seg(t, a, b) { return cl((t - a) / (b - a), 0, 1); }
function lerp(a, b, k) { return a + (b - a) * k; }
function eio(k) { return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
function eout(k) { return 1 - Math.pow(1 - k, 3); }
function hash(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function bay(x, y) { return (BAY[(x & 3) + (y & 3) * 4] + .5) / 16; }

// ---------- camera ----------
function camAt(keys, t) {
  if (t <= keys[0][0]) return { x: keys[0][1], y: keys[0][2], z: keys[0][3] };
  for (var i = 1; i < keys.length; i++) {
    var k0 = keys[i - 1], k1 = keys[i], ts = k1[4] != null ? k1[0] - k1[4] : k0[0];
    if (t < k1[0]) { var k = t < ts ? 0 : eio(seg(t, ts, k1[0])); return { x: lerp(k0[1], k1[1], k), y: lerp(k0[2], k1[2], k), z: lerp(k0[3], k1[3], k) }; }
  }
  var L = keys[keys.length - 1]; return { x: L[1], y: L[2], z: L[3] };
}
function blit(cam, dx, dy, dw, dh, ctx, src) {
  src = src || LB[0]; var sw = W / cam.z, sh = H / cam.z;
  var sx = cl(cam.x - sw / 2, 0, Math.max(0, W - sw)), sy = cl(cam.y - sh / 2, 0, Math.max(0, H - sh));
  sx = Math.round(sx * cam.z * 4) / (cam.z * 4); sy = Math.round(sy * cam.z * 4) / (cam.z * 4);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(src, sx, sy, sw, sh, dx, dy, dw, dh);
}

// ---------- low-res drawing helpers (L = LB context) ----------
var L = LB[1];
function img(n, x, y, flip, sx, sy) {
  var i = A[n]; if (!i) return; sx = sx == null ? 1 : sx; sy = sy == null ? sx : sy;
  L.save(); L.translate(Math.round(x), Math.round(y)); if (flip) { L.translate(Math.round(i.width * sx), 0); L.scale(-1, 1); }
  L.drawImage(i, 0, 0, Math.max(1, Math.round(i.width * sx)), Math.max(1, Math.round(i.height * sy))); L.restore();
}
function rect(x, y, w, h, c) { L.fillStyle = c; L.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function ddisc(cx, cy, r, c, a, ctx) {           // dithered glow disc (crisp pixels, no blur)
  ctx = ctx || L; ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); var R = Math.ceil(r);
  for (var y = -R; y <= R; y++) for (var x = -R; x <= R; x++) { var d = Math.sqrt(x * x + y * y) / r; if (d > 1) continue; if (bay(cx + x, cy + y) < a * (1 - d * d)) ctx.fillRect(cx + x, cy + y, 1, 1); }
}
function spark(x, y, c, big) { rect(x, y, 1, 1, c); if (big) { rect(x - 1, y, 1, 1, c); rect(x + 1, y, 1, 1, c); rect(x, y - 1, 1, 1, c); rect(x, y + 1, 1, 1, c); } }

// ---------- pixel font 5x7 ----------
var F = {A:"01110100011000111111100011000110001",B:"11110100011000111110100011000111110",C:"01110100011000010000100001000101110",D:"11110100011000110001100011000111110",
E:"11111100001000011110100001000011111",F:"11111100001000011110100001000010000",G:"01110100011000010111100011000101111",H:"10001100011000111111100011000110001",
I:"01110001000010000100001000010001110",J:"00111000100001000010000101001001100",K:"10001100101010011000101001001010001",L:"10000100001000010000100001000011111",
M:"10001110111010110101100011000110001",N:"10001100011100110101100111000110001",O:"01110100011000110001100011000101110",P:"11110100011000111110100001000010000",
Q:"01110100011000110001101011001001101",R:"11110100011000111110101001001010001",S:"01111100001000001110000010000111110",T:"11111001000010000100001000010000100",
U:"10001100011000110001100011000101110",V:"10001100011000110001100010101000100",W:"10001100011000110101101011010101010",X:"10001100010101000100010101000110001",
Y:"10001100010101000100001000010000100",Z:"11111000010001000100010001000011111","0":"01110100011001110101110011000101110","1":"00100011000010000100001000010001110",
"2":"01110100010000100010001000100011111","3":"11110000010000101110000010000111110","4":"00010001100101010010111110001000010","5":"11111100001111000001000011000101110",
"6":"00110010001000011110100011000101110","7":"11111000010001000100010000100001000","8":"01110100011000101110100011000101110","9":"01110100011000101111000010001001100",
".":"00000000000000000000000000110001100",",":"00000000000000000000011000010001000",":":"00000011000110000000011000110000000","'":"00100001000100000000000000000000000",
"?":"01110100010000100010001000000000100","!":"00100001000010000100001000000000100","-":"00000000000000011111000000000000000","@":"01110100011011110101101111000001110",
"/":"00001000100001000100010000100010000"," ":"00000000000000000000000000000000000"};
function glyph(ctx, ch, x, y, b, c) { var g = F[ch] || F[" "]; ctx.fillStyle = c; for (var i = 0; i < 35; i++) if (g[i] === "1") ctx.fillRect(x + (i % 5) * b, y + Math.floor(i / 5) * b, b, b); }
function ptext(ctx, s, x, y, b, c) { for (var i = 0; i < s.length; i++) glyph(ctx, s[i], x + i * 6 * b, y, b, c); }
function pwidth(s, b) { return s.length * 6 * b - b; }

// screen-level caption: *word* = accent. Letters type on, shadowed, pixel blocks of 8 px (= 2 art px).
function caption(t, s, a, b, opt) {
  opt = opt || {}; if (t < a || t > b) return; var B = opt.b || 8, y0 = opt.y || 230, maxc = Math.floor((OW - 96) / (6 * B));
  var words = [], acc = false; s.split(" ").forEach(function (w) { var st = w[0] === "*", en = w[w.length - 1] === "*" || w.slice(-2) === "*." || w.slice(-2) === "*?"; if (st) acc = true; words.push([w.replace(/\*/g, ""), acc]); if (en) acc = false; });
  var lines = [[]], len = 0; words.forEach(function (w) { if (len + w[0].length > maxc && len) { lines.push([]); len = 0; } lines[lines.length - 1].push(w); len += w[0].length + 1; });
  var shown = Math.floor((t - a) * 45), n = 0;
  lines.forEach(function (ln, li) {
    var str = ln.map(function (w) { return w[0]; }).join(" "), x = Math.round((OW - pwidth(str, B)) / 2), y = y0 + li * 11 * B;
    ln.forEach(function (w) {
      for (var i = 0; i < w[0].length; i++) { if (n++ >= shown) return; [[B, B], [B, 0], [-B, 0], [0, B], [0, -B], [B, -B], [-B, B], [-B, -B]].forEach(function (o) { glyph(X, w[0][i], x + o[0], y + o[1], B, "#1A1530"); }); glyph(X, w[0][i], x, y, B, w[1] ? (opt.accent || "#FFC145") : "#FFFFFF"); x += 6 * B; }
      n++; x += 6 * B;
    });
  });
}

// ---------- in-world choice sign ----------
function sign(label, cx, y, t, tPop, tPick, picked, tOut) {
  if (t < tPop || (tOut && t > tOut)) return; var k = eout(seg(t, tPop, tPop + .25)), w = label.length * 6 + 7, x = Math.round(cx - w / 2), yy = Math.round(y - (1 - k) * 10);
  var done = t >= tPick, col = done ? (picked ? "#28A86A" : "#6B6F80") : "#C98A4E", edge = done ? (picked ? "#1C7A4C" : "#4A4D5C") : "#8A5228";
  if (done && picked) { var p0 = eout(seg(t, tPick, tPick + .25)); ddisc(cx, yy + 6, 18 * p0, "#FFE9A0", .35 * (1 - seg(t, tPick + .3, tPick + .9))); }
  rect(x + w / 2 - 1, yy + 12, 2, 10, "#6B4430");
  rect(x - 1, yy - 1, w + 2, 14, "#2A1F2E"); rect(x, yy, w, 12, col); rect(x, yy + 10, w, 2, edge);
  ptext(L, label, x + 4, yy + 2, 1, done && !picked ? "#A8ABB8" : "#FFFFFF");
  if (done && picked) { var p = eout(seg(t, tPick, tPick + .25)); if (p > 0) { rect(x + w + 2, yy + 4, 2, 2, "#FFFFFF"); rect(x + w + 4, yy + 6, 2, 2, "#FFFFFF"); rect(x + w + 6, yy + 2, 2, 4, "#FFFFFF"); } }
  if (done && !picked) { rect(x, yy + 5, w, 1, "#4A4D5C"); }
}
function chr(n, x, y, flip) { img("c_" + n, x, y, flip); }      // character sprite 48x56, feet at y+53
var GY = 53;

// =================== SCENES (v4: chapters, separate choices, portal from the book) ===================
function birds(t, n, y0) { for (var i = 0; i < n; i++) { var bx = ((t * (14 + i * 3) + i * 70) % 320) - 25, by = y0 + i * 9 + Math.round(Math.sin(t * 2 + i) * 2), up = Math.floor(t * 6 + i) % 2;
  rect(bx, by, 1, 1, "#2F3E6B"); rect(bx - 1, by - up, 1, 1, "#2F3E6B"); rect(bx + 1, by - up, 1, 1, "#2F3E6B"); rect(bx - 2, by - 1, 1, 1, "#2F3E6B"); rect(bx + 2, by - 1, 1, 1, "#2F3E6B"); } }
function fieldBase(t) {
  L.drawImage(A.sky, 0, 0); var cx = Math.round(t * 3) % W; L.drawImage(A.clouds, cx - W, 0); L.drawImage(A.clouds, cx, 0);
  L.drawImage(A.far, 0, 0); L.drawImage(A.mid, 0, 0); L.drawImage(A.ground, 0, 0); L.drawImage(A.shadow, 0, 0);
  L.drawImage(A.flowers, Math.round(Math.sin(t * 1.6)), 0); L.drawImage(A.tree, 0, 0); birds(t, 3, 150);
}
function blinkAt(t, off) { return ((t + off) % 3.3) < .12; }
var BOOK = { x: 107, y: 374 }, GB = { x: 119, y: 389 };
var PCOL = ["#B07CFF", "#7A4FE0", "#FFC145", "#FFFFFF", "#4C2A9E", "#FF9FC2"];
function portal(cx, cy, rx, ry, t) {          // swirling pixel portal (oval door of light)
  if (rx < 1) return; ddisc(cx, cy, Math.max(rx, ry) * 1.5, "#B07CFF", .35);
  L.fillStyle = "#24104A"; for (var y = -ry; y <= ry; y++) { var w = Math.round(rx * Math.sqrt(1 - (y * y) / (ry * ry))); L.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); }
  for (var f = 1; f > .15; f -= .17) for (var a = 0; a < 6.283; a += .09 / f) {
    var c = PCOL[Math.floor(a * 2 + t * 9 * (f > .5 ? 1 : -1) + f * 7) % PCOL.length]; if (Math.floor(a * 6 + t * 10) % 3 === 0) continue;
    rect(cx + Math.cos(a) * rx * f, cy + Math.sin(a) * ry * f, 1, 1, c);
  }
  for (var i = 0; i < 10; i++) { var ph = (t * 1.2 + hash(i)) % 1, a2 = hash(i + 3) * 6.28 + t * 2; spark(cx + Math.cos(a2) * rx * (1.6 - ph), cy + Math.sin(a2) * ry * (1.2 - ph * .6), i % 2 ? "#FFE9A0" : "#FFFFFF", i % 4 === 0); }
}
// --- 1. the book opens a door (0 - 12) ---
function sPortal(t) {
  fieldBase(t);
  if (t < 4.6) {
    if (t > 2.9) { var g = seg(t, 2.9, 3.8); ddisc(BOOK.x, BOOK.y - 2, 6 + 14 * g + Math.sin(t * 9) * 2, "#FFE9A0", .55 * g);
      for (var i = 0; i < 8; i++) { var ph = (t * 1.5 + hash(i)) % 1; spark(BOOK.x - 6 + hash(i + 1) * 12, BOOK.y - 4 - ph * 22, i % 2 ? "#FFE9A0" : "#FFFFFF", false); } }
    img(blinkAt(t, 0) ? "reader_blink" : "reader", 82, 357);
  } else {
    var pk = eout(seg(t, 6.6, 7.9)), py = GB.y - 2 - 30 * pk;
    img("book_ground", GB.x - 9, GB.y - 4); ddisc(GB.x, GB.y - 2, 8 + 4 * Math.sin(t * 8), "#FFE9A0", .5);
    if (t > 6.5 && t < 7.0) for (var j = 0; j < 12; j++) { var r0 = seg(t, 6.5, 7.0) * 20; spark(GB.x + Math.cos(j) * r0, GB.y - 4 - Math.abs(Math.sin(j)) * r0, "#FFFFFF", false); }
    if (t < 11.25 || t > 11.25) portal(GB.x, py, Math.round(15 * pk), Math.round(30 * pk), t);
    var hop = t < 4.8 ? -2 : 0;
    if (t < 7.0) chr(blinkAt(t, .3) ? "blink" : "stand", 70, 392 - GY + hop);
    else if (t < 7.35) chr("walk" + (Math.floor(t * 10) % 4), lerp(70, 62, seg(t, 7.0, 7.35)), 392 - GY);
    else if (t < 9.9) chr("lookup", 62, 392 - GY);
    else if (t < 10.3) chr("stand", 62, 392 - GY);
    else if (t < 10.65) chr("crouch", 62, 392 - GY);
    else if (t < 11.25) { var k = seg(t, 10.65, 11.25), fx = lerp(86, GB.x, eio(k)), fy = lerp(392, py + 14, eio(k)) - Math.sin(k * Math.PI) * 26, sc = k < .6 ? 1 : 1 - (k - .6) / .4 * .85;
      img("c_jump", fx - 24 * sc, fy - 53 * sc, false, sc); }
  }
  return camAt([[0, 100, 368, 2.5], [4.5, 103, 370, 2.8], [5.2, 100, 362, 2.4, .6], [7.9, 102, 352, 2.3, 1.3], [10.3, 108, 360, 2.9, 1.4], [12.0, GB.x, GB.y - 32, 16, 1.4]], t);
}
// --- 2. ten years later (12 - 26.9) ---
function sFuture(t) {
  L.drawImage(A.house, 0, 0);
  var cx = lerp(-95, 118, eout(seg(t, 13.6, 15.2))), cy = 364, wf = Math.floor(cx / 3) & 1;
  img("car", cx, cy); img(wf ? "wheel1" : "wheel0", cx + 11, cy + 19); img(wf ? "wheel1" : "wheel0", cx + 60, cy + 19);
  if (t > 15.65) { var wk = seg(t, 15.8, 17.0), ox = lerp(150, 196, wk), f = wk > 0 && wk < 1 ? "owalk" + (Math.floor(t * 8) % 4) : (t > 17.2 ? "olook" : "ostand"); chr(f, ox - 24, 396 - GY); }
  // young: tumbles out of a portal on the lawn, hides behind the hedge, watches
  var pin = t < 13.1 ? 1 - seg(t, 12.75, 13.1) : 0, pout = t > 25.7 ? eout(seg(t, 25.7, 26.2)) : 0;
  if (pin > 0) portal(205, 424, Math.round(14 * pin), Math.round(28 * pin), t);
  if (pout > 0) portal(118, 398, Math.round(14 * pout), Math.round(28 * pout), t);
  if (t < 12.5) { var k = seg(t, 12.05, 12.5); img("c_jump", lerp(205, 172, k) - 24, lerp(424, 452, k) - 53 - Math.sin(k * Math.PI) * 10, true); }
  else if (t < 12.85) chr("crouch", 150, 452 - GY, true);
  else if (t < 13.3) chr("stand", 150, 452 - GY, true);
  else if (t < 14.7) { var k2 = seg(t, 13.3, 14.7); chr("walk" + (Math.floor(t * 8) % 4), lerp(150, 44, k2), lerp(452, 436, k2) - GY, true); }
  else if (t < 26.35) { var pose = t > 18.0 && t < 22.0 ? "shock" : (t >= 22.0 && t < 25.8 ? (blinkAt(t, 1) ? "blink" : "stand") : (t >= 25.8 ? "stand" : (blinkAt(t, 1) ? "blink" : "stand")));
    chr(pose, 44, 436 - GY, t < 17.6); }
  else if (t < 26.85) { var k3 = seg(t, 26.35, 26.85), sc = k3 < .5 ? 1 : 1 - (k3 - .5) * 1.7; img("c_jump", lerp(68, 118, eio(k3)) - 24 * sc, lerp(436, 412, k3) - 53 * sc - Math.sin(k3 * Math.PI) * 18, false, sc); }
  L.drawImage(A.hedge, 0, 0);
  if (t > 18.0 && t < 18.6) for (var i = 0; i < 4; i++) { var kk = seg(t, 18.0 + i * .05, 18.5); if (kk > 0 && kk < 1) spark(84 + i * 3, 386 - kk * 10 - i * 2, "#FFFFFF", true); }
  if (t > 22.0 && t < 25.8) { var q = Math.floor(t * 2) % 2; ptext(L, "?", 74, 372 - q, 1, "#FFFFFF"); }
  return camAt([[12.0, 192, 412, 2.6], [13.1, 186, 416, 2.6], [14.0, 140, 340, 1.4, .9], [15.3, 140, 345, 1.5], [16.6, 186, 352, 2.3, 1.1], [17.9, 170, 318, 1.8, 1.1], [19.8, 70, 398, 2.7, 1.4], [25.7, 74, 398, 2.9, 5.8], [26.9, 118, 398, 5, 1.0]], t);
}
// --- 3. the book flips to chapter 1 (26.9 - 30.6) ---
function woodBg() { rect(0, 0, W, H, "#3B2A24"); for (var y = 0; y < H; y += 12) rect(0, y, W, 1, "#33241F"); }
function sFlip(t) {
  woodBg(); var bx = 60, by = 192; ddisc(135, 240, 80, "#FFE9A0", .25); L.drawImage(A.bigbook, bx, by);
  var u = seg(t, 26.9, 30.2), flips = 22 * (1 - Math.pow(1 - u, 2.2)), ph = flips % 1;
  if (u < 1) { var ex = 135 + Math.cos(ph * Math.PI) * 72, top = by + 6 - Math.sin(ph * Math.PI) * 10;
    L.fillStyle = ph < .5 ? "#FFF4E0" : "#EADBB8"; L.beginPath(); L.moveTo(135, by + 8); L.lineTo(Math.round(ex), Math.round(top)); L.lineTo(Math.round(ex), Math.round(top + 86)); L.lineTo(135, by + 94); L.fill();
    rect(Math.round(ex), Math.round(top), 1, 86, "#C9B48A"); }
  if (u >= 1) { ptext(L, "CHAPTER", bx + 88, by + 30, 1, "#6A4FD1"); ptext(L, "ONE", bx + 98, by + 42, 2, "#2A1F2E"); }
  return camAt([[26.9, 135, 240, 1.5], [30.6, 135, 240, 1.8, 3.7]], t);
}
// --- chapter title cards ---
function card(n, title) {
  return function (t) {
    rect(0, 0, W, H, "#FFF4E0"); for (var y = 40; y < H; y += 14) rect(0, y, W, 1, "#EADBB8"); rect(28, 0, 1, H, "#F2A0A0");
    var c = "CHAPTER " + n, w = pwidth(c, 2); ptext(L, c, Math.round((W - w) / 2), 176, 2, "#6A4FD1");
    var words = title.split(" "), lines = [], cur = ""; words.forEach(function (wd) { if ((cur + " " + wd).trim().length > 12) { lines.push(cur.trim()); cur = wd; } else cur = (cur + " " + wd).trim(); }); lines.push(cur);
    lines.forEach(function (ln, i) { var w2 = pwidth(ln, 3); ptext(L, ln, Math.round((W - w2) / 2) + 1, 214 + i * 28 + 1, 3, "#E3D3AE"); ptext(L, ln, Math.round((W - w2) / 2), 214 + i * 28, 3, "#2A1F2E"); });
    rect(110, 214 + lines.length * 28 + 6, 50, 2, "#FFC145");
    return { x: 135, y: 240, z: 1 + .04 * Math.sin(t) };
  };
}
// --- page close-up (Chapter 1 and the ending): typed dream, sticky note, underline, glow ---
var DREAM = ["DREAM:", "BUILD MY", "OWN", "COMPANY."];
function pageView(t, o) {
