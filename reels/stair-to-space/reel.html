<!doctype html>
<html><head><meta charset="utf-8"><title>dmyor reel</title>
<style>
:root{
  --ink:#F7F7FB; --dim:#9BA0B4; --deep:#070812;
  --blue:#5B8CFF; --cyan:#33D6F5; --green:#34D399;
  --coral:#FB7185; --amber:#FBBF24; --violet:#A855F7;
}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
/* Slim grotesque at light weights. Big type carries the elegance through the
   letterforms and the space around them, not through weight. Light (300) rather
   than Thin (100) so it survives a phone screen at speed. */
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:center center;
 background:var(--deep);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
 font-family:"Helvetica Neue","Avenir Next",-apple-system,Helvetica,Arial,sans-serif}
#stage.serif{font-family:"Didot","Iowan Old Style","Palatino",Georgia,serif}
/* flat colour: hard blocks that wipe, no gradients */
#bg{position:absolute;inset:0;background:#08080C}
.bgpane{position:absolute;inset:0;transform:translateY(100%)}
/* a thin rule that sweeps the frame on a cut */
#sweep{position:absolute;left:0;width:100%;height:4px;opacity:0}
#grain{position:absolute;inset:0;opacity:.045;pointer-events:none;
 background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:3px 3px}
/* camera holds every scene, so a zoom moves the whole frame */
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.layer{position:absolute;inset:0}
/* kinetic type */
.kt{position:absolute;left:0;width:1080px;text-align:center;color:var(--ink);
 font-weight:250;letter-spacing:.2px;line-height:1.22;padding:0 76px;box-sizing:border-box}
.kt .accent{font-weight:300}
.kt.demi{font-weight:300;letter-spacing:-.2px}
.kt.demi .accent{font-weight:400}
.kt .w{display:inline-block;margin:0 .16em;will-change:transform,opacity}
.kt .accent{color:var(--blue)}
.kt.sub{font-weight:300;letter-spacing:1.2px;color:#C7CCDB;line-height:1.4}
/* big -> small */
#mcollapse{position:absolute;left:0;width:1080px;opacity:0;text-align:center}
#mclBig{font-size:64px;font-weight:250;letter-spacing:-.5px;color:var(--ink)}
#mclSmall{margin-top:30px;display:inline-block;border:2px solid var(--green);border-radius:36px;
 padding:20px 42px;font-size:40px;font-weight:300;color:var(--ink);opacity:0;background:rgba(52,211,153,.10)}
/* vague -> checkable */
#msharp{position:absolute;left:0;width:1080px;opacity:0;text-align:center}
#msOld{font-size:52px;font-weight:300;color:#C7CCDB}
#msNew{margin-top:22px;font-size:60px;font-weight:300;color:var(--ink)}
/* numbered steps */
#msteps{position:absolute;left:132px;width:816px;opacity:0}
.mstep{display:flex;align-items:baseline;gap:22px;margin-top:26px;opacity:.32}
.mstep.on{opacity:1}
.mstep i{font-style:normal;font-size:30px;font-weight:400;letter-spacing:3px;color:var(--blue);min-width:60px}
.mstep span{font-size:44px;font-weight:300;letter-spacing:.2px;color:var(--ink)}
/* odometer digits */
#roll{position:absolute;left:0;width:1080px;opacity:0;text-align:center}
.rollg{display:inline-block;overflow:hidden;height:150px;vertical-align:top}
.rollg .rs{display:block;font-size:126px;font-weight:250;line-height:150px;letter-spacing:-2px;color:var(--ink)}
#rollTail{margin-top:16px;font-size:42px;font-weight:300;letter-spacing:6px;color:#C7CCDB}
/* tokens that slam in */
#tokens{position:absolute;left:0;width:1080px;opacity:0;display:flex;justify-content:center;gap:20px}
.tok{border:2px solid;border-radius:18px;padding:24px 30px;font-size:42px;font-weight:300;
 white-space:nowrap;opacity:0;background:rgba(255,255,255,.06);color:var(--ink)}
/* one big number counting */
#bignum{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
#bignumV{font-size:250px;font-weight:200;letter-spacing:-10px;line-height:1;
 font-variant-numeric:tabular-nums;color:var(--ink)}
#bignumL{margin-top:8px;font-size:40px;font-weight:300;letter-spacing:8px;color:#C7CCDB}
/* a wall of day marks */
.daygrid{position:absolute;left:110px;width:860px;opacity:0;
 display:grid;grid-template-columns:repeat(15,1fr);gap:9px}
.dm{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.10);transform:scale(.3);opacity:0}
.dm.on{background:var(--ink)}
.dm.miss{background:transparent;box-shadow:inset 0 0 0 2px var(--coral)}
.dm.dead{background:rgba(251,113,133,.25)}
.dayLabel{position:absolute;left:0;width:1080px;text-align:center;font-size:54px;
 font-weight:250;letter-spacing:1px;color:#C7CCDB;opacity:0}
/* threshold ticks */
#thresh{position:absolute;left:0;width:1080px;opacity:0;display:flex;justify-content:center;gap:56px}
.th{text-align:center;opacity:0}
.th .thn{font-size:96px;font-weight:250;letter-spacing:-2px;color:var(--ink)}
.th .thl{margin-top:12px;font-size:32px;font-weight:300;letter-spacing:.4px;color:#C7CCDB;max-width:300px;line-height:1.28}
/* the bad-day floor */
#floor{position:absolute;left:230px;width:620px;opacity:0}
#floorBar{height:190px;border-radius:16px;border:2px solid var(--blue);position:relative;overflow:hidden}
#floorFill{position:absolute;left:0;right:0;bottom:0;height:0%;background:rgba(91,140,255,.28)}
#floorLine{position:absolute;left:0;right:0;bottom:26%;height:3px;background:var(--green);opacity:0}
#floorTag{position:absolute;right:14px;font-size:30px;font-weight:300;letter-spacing:2px;color:var(--green);opacity:0}
#floorCap{margin-top:24px;text-align:center;font-size:38px;font-weight:300;color:#C7CCDB}
/* two paths from one origin */
#paths{position:absolute;inset:0;opacity:0}
#pathSvg2{position:absolute;left:0;top:0;width:1080px;height:1920px}
.plabel{position:absolute;font-size:32px;letter-spacing:2px;text-transform:uppercase;opacity:0}
/* candidate answers */
#cands{position:absolute;left:0;top:0;width:1080px;opacity:0}
.cand{position:absolute;left:50%;transform:translateX(-50%);box-sizing:border-box;
 border-radius:999px;padding:20px 48px;font-size:37px;font-weight:300;letter-spacing:.3px;white-space:nowrap;
 border:2px solid;background:rgba(255,255,255,.04);opacity:0}
.cand .cline{position:absolute;left:8%;top:52%;width:84%;height:3px;border-radius:3px;
 transform:scaleX(0);transform-origin:left center}
/* a field of capability */
#field{position:absolute;inset:0;opacity:0}
.fdot{position:absolute;border-radius:50%}
/* an empty plan */
#plan{position:absolute;left:110px;width:860px;opacity:0;box-sizing:border-box;
 border:2px solid rgba(255,255,255,.18);border-radius:22px;background:rgba(255,255,255,.03);padding:34px}
#planTitle{font-size:38px;font-weight:300;letter-spacing:.4px;color:var(--ink)}
.prow{margin-top:20px;height:22px;border-radius:8px;background:rgba(255,255,255,.06)}
#planStamp{display:inline-block;margin-top:26px;font-size:31px;letter-spacing:3px;
 text-transform:uppercase;border:2px solid;border-radius:999px;padding:10px 24px;
 color:var(--coral);opacity:0}
/* chips: dreams, then the archive they become */
#chips{position:absolute;inset:0;opacity:0}
.chip{position:absolute;box-sizing:border-box;border-radius:14px;padding:15px 20px;
 font-size:27px;font-weight:300;letter-spacing:.2px;line-height:1.25;border:1px solid;white-space:nowrap;overflow:hidden}
.chip .cmeta{display:block;margin-top:8px;font-size:19px;letter-spacing:2px}
/* the empty slot waiting for you */
#slot{position:absolute;left:100px;width:880px;opacity:0;box-sizing:border-box;
 border:2px dashed var(--blue);border-radius:22px;padding:34px;background:rgba(91,140,255,.07)}
#slotLabel{font-size:26px;letter-spacing:4px;text-transform:uppercase;color:var(--blue)}
#slotText{margin-top:20px;font-size:46px;font-weight:300;letter-spacing:.3px;color:var(--ink)}
/* two stages */
#stages{position:absolute;left:90px;width:900px;opacity:0}
.stg{box-sizing:border-box;border-radius:20px;padding:26px 30px;margin-top:18px;
 border:2px solid rgba(255,255,255,.16);position:relative;overflow:hidden}
.stg .sfill{position:absolute;inset:0;width:0%;opacity:.22}
.stg .sn{position:relative;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:#C7CCDB}
.stg .st{position:relative;margin-top:12px;font-size:46px;font-weight:300;letter-spacing:.2px;color:var(--ink)}
.stg .sd{position:relative;margin-top:10px;font-size:32px;font-weight:300;color:#C7CCDB}
/* diagram: never miss twice */
#missr{position:absolute;left:0;width:1080px;opacity:0}
.mrow{display:flex;align-items:center;gap:26px;margin:0 auto 34px;width:900px;opacity:0}
.mrlab{width:150px;text-align:right;font-size:30px;font-weight:300;letter-spacing:1px;flex:none}
.mrcells{display:flex;gap:10px}
.mc{width:52px;height:52px;border-radius:11px;background:rgba(255,255,255,.10);
 border:2px solid transparent;box-sizing:border-box}
.mc.on{background:var(--ink)}
.mc.gap{background:transparent;border-color:var(--coral)}
.mc.dead{background:rgba(255,255,255,.06)}
#mrVerdict{margin-top:14px;text-align:center;font-size:44px;font-weight:300;letter-spacing:.5px;opacity:0}
/* diagram: compounding arc */
#arcw{position:absolute;left:0;width:1080px;opacity:0}
#arcSvg{width:1080px;height:700px;display:block}
#arcMarks{position:relative;height:0}
.amk{position:absolute;transform:translateX(-50%);text-align:center;opacity:0}
.amk .amn{font-size:52px;font-weight:300;color:var(--ink);letter-spacing:-1px}
.amk .aml{margin-top:8px;font-size:27px;font-weight:300;color:#C7CCDB;max-width:270px;line-height:1.28}
#arcCap{margin-top:26px;text-align:center;font-size:34px;font-weight:300;color:#C7CCDB;opacity:0}
/* line-drawn staircase */
#stairs{position:absolute;inset:0;pointer-events:none}
.stw{position:absolute;inset:0;opacity:0;overflow:hidden}
.stworld{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stsvg{position:absolute;left:0;top:0;overflow:visible}
.stmk{position:absolute;transform:translateY(-132%);white-space:nowrap;
 font-size:30px;font-weight:400;letter-spacing:2px;opacity:0}
.stcap{position:absolute;left:0;width:1080px;text-align:center;box-sizing:border-box;
 padding:0 100px;font-size:48px;font-weight:300;line-height:1.25;color:var(--ink);opacity:0}
/* a receipt: your year, itemised */
#receipt{position:absolute;left:0;width:1080px;opacity:0}
#rcPaper{width:904px;margin:0 auto;box-sizing:border-box;padding:42px 50px 112px;
 background:#F4F1E8;border-radius:6px;position:relative;
 font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#16181C}
#rcHead{text-align:center;padding-bottom:18px}
#rcTitle{font-size:86px;font-weight:500;letter-spacing:6px;line-height:1;opacity:0}
#rcSub{margin-top:14px;font-size:28px;font-weight:400;letter-spacing:5px;color:#5A5F68;opacity:0}
.rrow{display:flex;align-items:flex-end;gap:0;margin-top:17px;opacity:0}
.rlab{font-size:34px;font-weight:400;letter-spacing:-.4px;white-space:nowrap;flex:none}
.rlead{flex:1;margin:0 14px 11px;border-bottom:4px dotted #B6B1A3;
 transform:scaleX(0);transform-origin:left center}
.rfig{font-size:38px;font-weight:600;letter-spacing:1px;flex:none;min-width:84px;
 text-align:right;opacity:0;font-variant-numeric:tabular-nums}
#rcRule{margin-top:34px;height:4px;background:#16181C;transform:scaleX(0);
 transform-origin:left center}
.trow{display:flex;align-items:flex-end;margin-top:20px;opacity:0}
.tlab{font-size:36px;font-weight:600;letter-spacing:3px;white-space:nowrap;flex:none}
.tlead{flex:1;margin:0 14px 11px;border-bottom:4px dotted #B6B1A3}
.tfig{font-size:54px;font-weight:700;letter-spacing:1px;flex:none;min-width:150px;
 text-align:right;font-variant-numeric:tabular-nums}
.trow.big .tfig{font-size:84px}
#rcStamp{position:absolute;left:50%;bottom:24px;font-size:44px;font-weight:700;
 letter-spacing:4px;padding:14px 26px;border:5px solid;border-radius:10px;
 white-space:nowrap;transform:translateX(-50%) rotate(-8deg) scale(.6);opacity:0}
/* diagram: a record travelling a year axis */
#axisw{position:absolute;left:0;width:1080px;opacity:0}
#axSvg{position:absolute;left:0;top:150px;width:1080px;height:300px}
#axTicks{position:absolute;left:0;top:150px;width:1080px;height:300px}
.axt{position:absolute;transform:translateX(-50%);text-align:center}
.axt .axd{width:3px;height:26px;margin:0 auto;background:rgba(255,255,255,.30)}
.axt .axy{margin-top:14px;font-size:32px;font-weight:300;letter-spacing:1.5px;color:#C7CCDB}
.axt.on .axy{color:var(--ink)}
#axCard{position:absolute;left:0;top:0;width:430px;box-sizing:border-box;
 border:3px solid;border-radius:22px;padding:26px 28px;background:rgba(255,255,255,.05);opacity:0}
#axCardDate{font-size:26px;font-weight:400;letter-spacing:3px;text-transform:uppercase}
#axCardText{margin-top:14px;font-size:44px;font-weight:300;line-height:1.2;color:var(--ink)}
/* diagram: the stack of dreams you have right now */
#stackw{position:absolute;left:0;width:1080px;opacity:0}
#stackRows{width:900px;margin:0 auto}
.dch{display:flex;align-items:center;gap:22px;box-sizing:border-box;width:100%;
 border:3px solid;border-radius:20px;padding:22px 30px;margin-bottom:18px;
 background:rgba(255,255,255,.05);opacity:0}
.dch .ddot{width:20px;height:20px;border-radius:50%;flex:none}
.dch .dtx{font-size:42px;font-weight:300;color:var(--ink);letter-spacing:.2px}
#stackCap{margin-top:26px;text-align:center;font-size:38px;font-weight:300;color:#C7CCDB;opacity:0}
/* diagram: dated rows resolving into verdicts */
#verw{position:absolute;left:0;width:1080px;opacity:0}
#verRows{width:940px;margin:0 auto}
.vrow{display:flex;align-items:center;gap:20px;box-sizing:border-box;width:100%;
 border-bottom:2px solid rgba(255,255,255,.12);padding:22px 8px;opacity:0}
.vrow .vdate{font-size:27px;font-weight:400;letter-spacing:2px;color:#8E95AB;flex:none;width:132px}
.vrow .vtx{font-size:40px;font-weight:300;color:var(--ink);flex:1;text-align:left}
.vrow .vbadge{font-size:26px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;
 border:2px solid;border-radius:999px;padding:9px 20px;flex:none;opacity:0}
#verCap{margin-top:30px;text-align:center;font-size:38px;font-weight:300;color:#C7CCDB;opacity:0}
/* diagram: a year of days */
#ygrid{position:absolute;inset:0;opacity:0}
#ygWorld{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#ygCells,#ygLabels{position:absolute;left:0;top:0}
.yc{position:absolute;border-radius:16px;box-sizing:border-box;opacity:0}
.ylab{position:absolute;font-size:78px;font-weight:400;letter-spacing:6px;
 color:#7E869E;opacity:0;white-space:nowrap}
#ygCap{position:absolute;left:0;top:268px;width:1080px;box-sizing:border-box;
 padding:0 104px;text-align:center;line-height:1.26;
 font-size:46px;font-weight:300;letter-spacing:.3px;color:var(--ink);opacity:0}
#ygStat{position:absolute;left:0;top:274px;width:1080px;text-align:center;opacity:0}
#ygNum{display:block;font-size:150px;font-weight:200;letter-spacing:-5px;color:var(--ink);
 font-variant-numeric:tabular-nums;line-height:1}
#ygLab{display:block;margin-top:8px;font-size:38px;font-weight:300;letter-spacing:5px;
 text-transform:uppercase;color:#C7CCDB}
/* diagram: method pipeline */
#flow{position:absolute;left:0;width:1080px;opacity:0}
#flowRow{display:flex;align-items:stretch;justify-content:center;gap:0}
.fnode{width:236px;box-sizing:border-box;border:2px solid;border-radius:20px;padding:26px 20px;
 text-align:center;background:rgba(255,255,255,.04);opacity:0}
.fnode .fnn{font-size:24px;letter-spacing:3px;font-weight:400}
.fnode .fnt{margin-top:12px;font-size:36px;font-weight:300;color:var(--ink);line-height:1.2}
.fconn{align-self:center;width:56px;height:3px;background:var(--dim);transform:scaleX(0);
 transform-origin:left center;flex:none}
#flowCap{margin-top:30px;text-align:center;font-size:34px;font-weight:300;color:#C7CCDB;opacity:0}
/* end */
#endc{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
#endMark{font-size:122px;font-weight:250;letter-spacing:-1px;color:var(--ink)}
#endUrl{margin-top:30px;font-size:46px;letter-spacing:2.4px;font-weight:300;color:var(--blue);
 font-variant-numeric:tabular-nums}
#playBtn{position:fixed;inset:0;margin:auto;width:210px;height:64px;border-radius:32px;
 border:2px solid var(--blue);background:rgba(7,8,18,.92);color:var(--ink);font-family:inherit;
 font-size:18px;letter-spacing:2px;cursor:pointer;z-index:1000}
</style></head><body>
<div id="viewport"><div id="stage">
 <div id="bg"></div>
 <div id="cam">
  <div class="layer" id="paths"><svg id="pathSvg2" viewBox="0 0 1080 1920">
    <path id="pA1" fill="none" stroke-width="5" stroke-linecap="round"/>
    <path id="pB1" fill="none" stroke-width="5" stroke-linecap="round"/>
    <circle id="pOrigin" r="14"/><circle id="pGoal" r="18" fill="none" stroke-width="4"/>
    <circle id="pDotA" r="11"/><circle id="pDotB" r="11"/></svg>
   <div class="plabel" id="plA">reached it</div>
   <div class="plabel" id="plB">stopped</div>
   <div class="plabel" id="plO">today</div>
   <div class="plabel" id="plG">january</div></div>
  <div class="layer" id="field"></div>
  <div id="roll"><span id="rollDigits"></span><div id="rollTail"></div></div>
  <div id="mcollapse"><div id="mclBig"></div><div><span id="mclSmall"></span></div></div>
  <div id="msharp"><div id="msOld"></div><div id="msNew"></div></div>
  <div id="msteps"></div>
  <div id="tokens"></div>
  <div id="bignum"><div id="bignumV">0</div><div id="bignumL"></div></div>
  <div id="daygrids"></div>
  <div id="thresh"></div>
  <div id="floor"><div id="floorBar"><div id="floorFill"></div><div id="floorLine"></div>
    <div id="floorTag">bad day floor</div></div><div id="floorCap"></div></div>
  <div class="layer" id="chips"></div>
  <div id="cands"></div>
  <div id="plan"><div id="planTitle"></div><div class="prow"></div><div class="prow"></div>
   <div class="prow"></div><div id="planStamp">no plan</div></div>
  <div id="slot"><div id="slotLabel">your dream</div><div id="slotText"></div></div>
  <div id="stages"></div>
  <div id="endc"><div id="endMark"></div><div id="endUrl"></div></div>
  <!-- diagram: the streak rule, one gap recovers / two gaps break -->
  <div id="missr">
   <div class="mrow" id="mrowA"><div class="mrlab" id="mrlabA"></div><div class="mrcells" id="mcellsA"></div></div>
   <div class="mrow" id="mrowB"><div class="mrlab" id="mrlabB"></div><div class="mrcells" id="mcellsB"></div></div>
   <div id="mrVerdict"></div>
  </div>
  <!-- diagram: compounding arc crossing labelled thresholds -->
  <div id="arcw"><svg id="arcSvg" viewBox="0 0 1080 700">
    <path id="arcAxis" fill="none" stroke-width="2"/>
    <path id="arcCurve" fill="none" stroke-width="6" stroke-linecap="round"/>
   </svg><div id="arcMarks"></div><div id="arcCap"></div></div>
  <!-- line-drawn staircase, camera does the acting -->
  <div id="stairs"></div>
  <!-- a receipt: your year, itemised -->
  <div id="receipt"><div id="rcPaper">
   <div id="rcHead"><div id="rcTitle"></div><div id="rcSub"></div></div>
   <div id="rcRows"></div>
   <div id="rcRule"></div>
   <div id="rcTotals"></div>
   <div id="rcStamp"></div>
  </div></div>
  <!-- diagram: a record carried forward along a year axis -->
  <div id="axisw">
   <svg id="axSvg" viewBox="0 0 1080 300"><path id="axLine" fill="none" stroke-width="4"/></svg>
   <div id="axTicks"></div>
   <div id="axCard"><div id="axCardDate"></div><div id="axCardText"></div></div>
  </div>
  <!-- diagram: the dreams you have now, and what happens if you leave them -->
  <div id="stackw"><div id="stackRows"></div><div id="stackCap"></div></div>
  <!-- diagram: dated rows resolving into verdicts -->
  <div id="verw"><div id="verRows"></div><div id="verCap"></div></div>
  <!-- diagram: a year of days, zooming out scale by scale -->
  <div id="ygrid">
   <div id="ygWorld"><div id="ygCells"></div><div id="ygLabels"></div></div>
   <div id="ygCap"></div>
   <div id="ygStat"><span id="ygNum"></span><span id="ygLab"></span></div>
  </div>
  <!-- diagram: the method as a three-stage pipeline -->
  <div id="flow"><div id="flowRow"></div><div id="flowCap"></div></div>
  <div class="layer" id="ktLayer"></div>
 </div>
 <div id="sweep"></div>
 <div id="grain"></div>
</div></div>

<script>
/* dmyor motion engine: colour, kinetic type, camera moves.
   Same contract as the mono engine - everything is a pure function of time, so
   record.js can seek frame by frame and verify.js can audit it. */
(function(){
"use strict";
var TOTAL=TL.total, W=1080, H=1920;
var stage=document.getElementById("stage"), sc=1;
function fit(){ sc=Math.min(innerWidth/W, innerHeight/H); stage.style.transform="scale("+sc+")"; }
if(TL.font==="serif") stage.classList.add("serif");
fit(); addEventListener("resize",fit);
var cl=function(x){return x<0?0:(x>1?1:x)};
var seg=function(t,a,b){return b<=a?(t>=b?1:0):cl((t-a)/(b-a))};
var eio=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
var eo=function(x){return 1-Math.pow(1-x,3)};
var eob=function(x){var c=1.7;return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}; // slight overshoot
function fade(e,o){ if(e) e.style.opacity=o; }
function S(t2){ for(var i=0;i<TL.scenes.length;i++) if(TL.scenes[i].type===t2) return TL.scenes[i]; return null; }
function ALL(t2){ return TL.scenes.filter(function(x){return x.type===t2;}); }
// a scene may show in several windows: [[in,out],[in,out]]. Opacity is their union.
function winFade(sc,t){ var ws=sc.windows||[[sc.in,sc.out]], o=0;
 for(var i=0;i<ws.length;i++){ var a=ws[i][0], b=ws[i][1];
  var v=seg(t,a,a+0.32)*(1-seg(t,b,b+0.42)); if(v>o) o=v; }
 return o; }
var CO={blue:"#5B8CFF",cyan:"#33D6F5",green:"#34D399",coral:"#FB7185",amber:"#FBBF24",violet:"#A855F7",ink:"#F7F7FB",dim:"#9BA0B4"};
function col(n){ return CO[n]||n||CO.blue; }

// ---------- flat colour: panes that wipe up, no gradients ----------
var bgEl=document.getElementById("bg"), sweepEl=document.getElementById("sweep");
var BG=(TL.bg||[]);                    // [{t, c, dir}]
var bgPanes=BG.map(function(b){
  var d=document.createElement("div"); d.className="bgpane";
  d.style.background=col(b.c); bgEl.appendChild(d); return d; });

// ---------- kinetic type ----------
var ktLayer=document.getElementById("ktLayer");
var KTS=ALL("kinetic.title").map(function(k){
  var el=document.createElement("div"); el.className="kt"+(k.sub?" sub":"")+(k.demi?" demi":"");
  el.style.fontSize=(k.size||86)+"px";
  el.style.top=((k.y||860))+"px";
  var words=(k.text||"").split(" ");
  var spans=words.map(function(w){
    var bare=function(x){return x.replace(/[^A-Za-z]/g,"").toLowerCase();};
    // strip punctuation from BOTH sides: "today." in accentWords must match the word "today."
    var acc=k.accentWords&&k.accentWords.map(bare).indexOf(bare(w))>=0;
    var s2=document.createElement("span"); s2.className="w"+(acc?" accent":"");
    s2.textContent=w; el.appendChild(s2); return s2; });
  ktLayer.appendChild(el);
  return {sc:k, el:el, spans:spans};
});

// ---------- two paths ----------
var pSc=S("split.paths");
var pathsEl=document.getElementById("paths"), pA1=document.getElementById("pA1"), pB1=document.getElementById("pB1");
var pOrigin=document.getElementById("pOrigin"), pGoal=document.getElementById("pGoal");
var pDotA=document.getElementById("pDotA"), pDotB=document.getElementById("pDotB");
var plA=document.getElementById("plA"), plB=document.getElementById("plB");
var plO=document.getElementById("plO"), plG=document.getElementById("plG");
var pLenA=0,pLenB=0;
if(pSc){
  pA1.setAttribute("d","M170,1500 C420,1440 560,1180 900,700");

  pB1.setAttribute("stroke",col(pSc.loseColor||"coral"));
  pOrigin.setAttribute("cx",170); pOrigin.setAttribute("cy",1500); pOrigin.setAttribute("fill",CO.dim);
  pGoal.setAttribute("cx",900); pGoal.setAttribute("cy",700); pGoal.setAttribute("stroke",col(pSc.winColor||"green"));
  pDotA.setAttribute("fill",col(pSc.winColor||"green")); pDotB.setAttribute("fill",col(pSc.loseColor||"coral"));
  pLenA=pA1.getTotalLength(); pLenB=pB1.getTotalLength();
  pA1.style.strokeDasharray=pLenA; pB1.style.strokeDasharray=pLenB;
  plA.style.color=col(pSc.winColor||"green"); plB.style.color=col(pSc.loseColor||"coral");
  if(pSc.winLabel) plA.textContent=pSc.winLabel;
  if(pSc.loseLabel) plB.textContent=pSc.loseLabel;
  plA.style.left="700px"; plA.style.top="612px";
  plB.style.left="700px"; plB.style.top="1290px";
  plO.style.left="120px"; plO.style.top="1540px"; plO.style.color=CO.dim;
  plG.style.left="700px"; plG.style.top="560px"; plG.style.color=CO.dim;
  if(pSc.originLabel) plO.textContent=pSc.originLabel;
  if(pSc.goalLabel) plG.textContent=pSc.goalLabel;
}

// ---------- candidate answers ----------
var cSc=S("cards.dismiss"), candEls=[];
var candsEl=document.getElementById("cands");
if(cSc){ (cSc.items||[]).forEach(function(it,i){
  var d=document.createElement("div"); d.className="cand";
  d.style.top=(i*116)+"px"; d.style.borderColor=col(it.color||"blue"); d.style.color=CO.ink;
  d.innerHTML=it.text+'<span class="cline" style="background:'+col(it.color||"blue")+'"></span>';

  candsEl.style.top=(cSc.y||700)+"px"; }

// ---------- field of capability ----------
var fSc=S("field.expand"), fDots=[];
var fieldEl=document.getElementById("field");

 for(var i2=0;i2<N;i2++){
  var d=document.createElement("div"); d.className="fdot";
  var cn=["blue","cyan","violet","amber","green"][i2%5];

  d.style.cssText="width:"+sz+"px;height:"+sz+"px;background:"+col(cn);

  fDots.push({el:d, a:(i2/N)*Math.PI*2*3.2, r:120+(i2%13)*52, ph:i2*0.37}); } }

// ---------- empty plan ----------
var plSc=S("plan.empty");
var planEl=document.getElementById("plan"), planStamp=document.getElementById("planStamp");
if(plSc){ document.getElementById("planTitle").textContent=plSc.title||"";
  planEl.style.top=(plSc.y||820)+"px";

  if(plSc.stampBorder) planStamp.style.borderColor=col(plSc.stampColor||"green"); }

// ---------- chips: dreams -> archive ----------
var chSc=S("chips.reorder"), chips=[];
var chipsEl=document.getElementById("chips");
if(chSc){ (chSc.items||[]).forEach(function(it,i){
  var d=document.createElement("div"); d.className="chip";
  var cn=["blue","violet","cyan","amber","green","coral"][i%6];
  d.style.borderColor="rgba(255,255,255,.16)"; d.style.color=CO.ink;
  d.style.background="rgba(255,255,255,.03)";
  d.innerHTML=it+'<span class="cmeta">standby</span>';
  chipsEl.appendChild(d);
  var col2=i%3, row=(i/3)|0;
  chips.push({el:d, meta:d.querySelector(".cmeta"), cn:cn,
    sx:120+((i*137)%780), sy:520+((i*211)%900),          // scattered
    gx:96+col2*312, gy:590+row*168 }); }); }              // ordered

// ---------- the slot waiting ----------
var slSc=S("slot.waiting");
var slotEl=document.getElementById("slot"), slotText=document.getElementById("slotText");
if(slSc) slotEl.style.top=(slSc.y||900)+"px";

// ---------- two stages ----------
var stSc=S("stage.two"), stEls=[];
var stagesEl=document.getElementById("stages");
if(stSc){ stagesEl.style.top=(stSc.y||760)+"px";
 (stSc.items||[]).forEach(function(it,i){
  var d=document.createElement("div"); d.className="stg";
  d.innerHTML='<span class="sfill" style="background:'+col(it.color||"blue")+'"></span>'+
    '<div class="sn">'+it.no+'</div><div class="st">'+it.title+'</div><div class="sd">'+it.body+'</div>';
  stagesEl.appendChild(d); stEls.push({el:d, fill:d.querySelector(".sfill"), sc:it}); }); }

// ---------- end ----------
var eSc=S("end.card");
var endc=document.getElementById("endc"), endMark=document.getElementById("endMark"), endUrl=document.getElementById("endUrl");
if(eSc){ endc.style.top=(eSc.y||840)+"px"; endMark.textContent=(TL.brand&&TL.brand.mark)||"dmyor"; }
var URL_TXT=(TL.brand&&TL.brand.url)||"";

// ---------- big -> small ----------
var clSc=S("collapse.step"), collapseEl=document.getElementById("mcollapse"),
    clBig=document.getElementById("mclBig"), clSmall=document.getElementById("mclSmall");
if(clSc){ collapseEl.style.top=(clSc.y||820)+"px"; clBig.textContent=clSc.big||"";
  clSmall.textContent=clSc.small||""; }

var shSc=S("sharpen.text"), sharpenEl=document.getElementById("msharp"),

if(shSc) sharpenEl.style.top=(shSc.y||1180)+"px";

// ---------- numbered steps ----------
var st3Sc=S("steps.three"), steps3El=document.getElementById("msteps"), s3Els=[];

  steps3El.appendChild(d); s3Els.push(d); }); }

// ---------- odometer roll ----------
var rlSc=S("date.roll"), rollEl=document.getElementById("roll"),
    rollDigits=document.getElementById("rollDigits"), rollTail=document.getElementById("rollTail");
var rollGlyphs=[];
if(rlSc){ rollEl.style.top=(rlSc.y||760)+"px"; rollTail.textContent=rlSc.tail||"";
 (rlSc.to||"").split("").forEach(function(ch,i){
  var g=document.createElement("span"); g.className="rollg";
  var st=document.createElement("span"); st.className="rs";
  g.appendChild(st); rollDigits.appendChild(g);
  rollGlyphs.push({st:st, from:((rlSc.from||"")[i]||ch), to:ch}); }); }

// ---------- tokens ----------
var tkSc=S("tokens.land"), tokEls=[], tokensEl=document.getElementById("tokens");
if(tkSc){ tokensEl.style.top=(tkSc.y||880)+"px";
 (tkSc.items||[]).forEach(function(it,i){
  var d=document.createElement("div"); d.className="tok";
  d.style.borderColor=col(it.color||["blue","cyan","amber"][i%3]);

// ---------- big counter ----------
var bnSc=S("count.up"), bignumEl=document.getElementById("bignum"),

  var g=document.createElement("div"); g.className="daygrid";
  g.style.top=(sc.y||700)+"px"; wrap.appendChild(g);

var thSc=S("thresholds"), thEls=[], threshEl=document.getElementById("thresh");

var flSc=S("floor.bar"), floorEl=document.getElementById("floor"),

if(flSc){ floorEl.style.top=(flSc.y||820)+"px"; floorCap.textContent=flSc.caption||""; }

// ---------- diagram: never miss twice ----------
var mrSc=S("miss.rule"), missrEl=document.getElementById("missr");
var mrRows=[], mrVerd=document.getElementById("mrVerdict");
if(mrSc){ missrEl.style.top=(mrSc.y||760)+"px";
 [["A",mrSc.rowA],["B",mrSc.rowB]].forEach(function(pair){
  var key=pair[0], r=pair[1]||{};

  mrRows.push({row:row, cells:cells, sc:r}); }); }

// ---------- diagram: compounding arc ----------
var arSc=S("arc.curve"), arcwEl=document.getElementById("arcw");
var arcCurve=document.getElementById("arcCurve"), arcAxis=document.getElementById("arcAxis");
var arcMarksEl=document.getElementById("arcMarks"), arcCap=document.getElementById("arcCap");
var arcLen=0, arcMarks=[];
if(arSc){ arcwEl.style.top=(arSc.y||620)+"px";
 arcAxis.setAttribute("d","M90,610 L1000,610");
 arcAxis.setAttribute("stroke","rgba(255,255,255,.16)");
 // slow start, steep finish: the point is that it compounds
 arcCurve.setAttribute("d","M90,600 C420,586 700,470 1000,110");
 arcCurve.setAttribute("stroke",col(arSc.color||"green"));
 arcLen=arcCurve.getTotalLength(); arcCurve.style.strokeDasharray=arcLen;
 arcCap.textContent=arSc.caption||"";
 var NS="http://www.w3.org/2000/svg";
 (arSc.items||[]).forEach(function(it){
  // anchor the mark to the actual point on the curve, not a guessed x
  var f=(it.at01!=null?it.at01:0.5);
  var pt=arcCurve.getPointAtLength(arcLen*f);
  var tick=document.createElementNS(NS,"line");
  tick.setAttribute("x1",pt.x); tick.setAttribute("y1",pt.y);
  tick.setAttribute("x2",pt.x); tick.setAttribute("y2",610);
  tick.setAttribute("stroke",col(arSc.color||"green"));
  tick.setAttribute("stroke-width",2); tick.setAttribute("stroke-dasharray","6 8");
  tick.style.opacity=0; arcCurve.parentNode.insertBefore(tick,arcCurve);

  dot.setAttribute("cx",pt.x); dot.setAttribute("cy",pt.y); dot.setAttribute("r",10);
  dot.setAttribute("fill",col(arSc.color||"green")); dot.style.opacity=0;
  arcCurve.parentNode.appendChild(dot);
  var d=document.createElement("div"); d.className="amk";
  d.innerHTML='<div class="amn">'+it.n+'</div><div class="aml">'+it.label+'</div>';
  d.style.left=pt.x+"px"; d.style.top=(arSc.markTop||30)+"px";
  arcMarksEl.appendChild(d);

// ---------- diagram: the method as a pipeline ----------

var fwNodes=[], fwConns=[];
if(fwSc){ flowEl.style.top=(fwSc.y||780)+"px"; flowCap.textContent=fwSc.caption||"";
 (fwSc.items||[]).forEach(function(it,i){

         flowRow.appendChild(c2); fwConns.push(c2); }
  var d=document.createElement("div"); d.className="fnode";
  d.style.borderColor=col(it.color||"blue");
  d.innerHTML='<div class="fnn" style="color:'+col(it.color||"blue")+'">0'+(i+1)+'</div>'+

// ---------- line-drawn staircase: the camera does the acting ----------
var NSVG="http://www.w3.org/2000/svg";
var stairsEl=document.getElementById("stairs");
var STAIRS=ALL("stair.build").map(function(sc){
  var wrap=document.createElement("div"); wrap.className="stw";
  var world=document.createElement("div"); world.className="stworld";
  // no viewBox on purpose: SVG user units must equal world px and share the
  // origin with the HTML labels in the same transformed layer. overflow:visible
  // lets negative coordinates (everything above ground) still paint.
  var svg=document.createElementNS(NSVG,"svg"); svg.setAttribute("class","stsvg");
  svg.setAttribute("width","1"); svg.setAttribute("height","1");
  world.appendChild(svg); wrap.appendChild(world);
  var cap=document.createElement("div"); cap.className="stcap";
  cap.style.top=(sc.capY==null?300:sc.capY)+"px"; wrap.appendChild(cap);
  stairsEl.appendChild(wrap);

  var PX=sc.pxPerM||20, rise=(sc.stepRise||0.17)*PX, run=(sc.stepRun||0.28)*PX;
  var n=sc.steps||1;

  // ground line
  var ground=document.createElementNS(NSVG,"line");

     ch.el.style.borderColor=col(ch.cn); ch.meta.textContent=chSc.metaText||"on the record";
     ch.meta.style.color=col(ch.cn); }
   else { ch.el.style.borderColor="rgba(255,255,255,.16)"; ch.meta.textContent="standby";
     ch.meta.style.color=CO.dim; } }); }
 else fade(chipsEl,0);

 // the empty slot waiting for you
 if(slSc){ fade(slotEl, seg(t,slSc.in,slSc.in+0.35)*(1-seg(t,slSc.out,slSc.out+0.4)));
  var n2=Math.floor(cl((t-(slSc.typeAt||slSc.in))/1.1)*(slSc.text||"").length);
  slotText.textContent=(slSc.text||"").slice(0,n2)+((Math.floor(t*2)%2)?"|":"");
  slotEl.style.transform="scale("+(0.98+0.02*eob(cl((t-slSc.in)/0.5)))+")"; }
 else fade(slotEl,0);

 // two stages
 if(stSc){ fade(stagesEl, seg(t,stSc.in,stSc.in+0.4)*(1-seg(t,stSc.out,stSc.out+0.4)));
  stEls.forEach(function(Sg,i){
   var a3=Sg.sc.at!=null?Sg.sc.at:stSc.in;
   var p=eob(cl((t-a3)/0.45));
   Sg.el.style.transform="translateX("+((1-p)*(i%2?60:-60))+"px)";
   Sg.el.style.opacity=cl(p);
   Sg.el.style.borderColor= t>=a3+0.2 ? col(Sg.sc.color||"blue") : "rgba(255,255,255,.16)";
   Sg.fill.style.width=(eio(seg(t,Sg.sc.fillAt!=null?Sg.sc.fillAt:a3, (Sg.sc.fillAt!=null?Sg.sc.fillAt:a3)+1.1))*(Sg.sc.fillPct!=null?Sg.sc.fillPct:100))+"%"; }); }
 else fade(stagesEl,0);

 // end card, URL typing with the voice
 if(eSc){ fade(endc, seg(t,eSc.in,eSc.in+0.5));
  var ep=eob(cl((t-eSc.in)/0.6));
  endMark.style.transform="scale("+(0.9+0.1*ep)+")";
  var us=eSc.urlStart!=null?eSc.urlStart:eSc.in, ue=eSc.urlEnd!=null?eSc.urlEnd:eSc.in+2;
  var un=Math.floor(cl((t-us)/Math.max(0.1,ue-us))*URL_TXT.length);
  endUrl.textContent=t<us?"":URL_TXT.slice(0,un); }
 else fade(endc,0);
}

// ================= driver =================
var st0=null,raf=null;
function frame(now){ if(st0===null)st0=now; var t=(now-st0)/1000;
 if(t>=TOTAL){render(TOTAL);raf=null;return;} render(t); raf=requestAnimationFrame(frame); }
function play(){ document.getElementById("playBtn").style.display="none"; st0=null;
 if(raf)cancelAnimationFrame(raf); raf=requestAnimationFrame(frame); }
addEventListener("load",function(){
 render(0);
 window.__seek=function(x){render(x);}; window.__duration=TOTAL;
 var q=new URLSearchParams(location.search), tp=q.get("t");
 if(tp!==null&&!isNaN(parseFloat(tp))){ document.getElementById("playBtn").style.display="none"; render(parseFloat(tp)); return; }
 if(q.get("autoplay")==="1") play(); else document.getElementById("playBtn").addEventListener("click",play);
});
})();
