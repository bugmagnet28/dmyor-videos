      for(var j=0;j<m.length-1;j++){if(t>=m[j][0]&&t<m[j+1][0]){ft=m[j][1]+(m[j+1][1]-m[j][1])*(t-m[j][0])/(m[j+1][0]-m[j][0]);break;}}
      if(t<m[0][0])ft=m[0][1];
      var fr=c.frames,lo=0,hi=fr.length-1;while(lo<hi){var mid=(lo+hi+1)>>1;if(fr[mid][0]<=ft)lo=mid;else hi=mid-1;}
      return c.dir+"/"+fr[lo][1];}}
  var last=PH.clips[PH.clips.length-1];return last.dir+"/"+last.frames[last.frames.length-1][1];}
function zoomAt(t){var Z=PH.zooms||[];if(!Z.length)return {s:1,x:.5,y:.5};if(t<=Z[0].t)return Z[0];
  for(var i=0;i<Z.length-1;i++){var a=Z[i],b=Z[i+1];if(t>=a.t&&t<=b.t){var k=eio((t-a.t)/Math.max(.001,b.t-a.t));return {s:a.s+(b.s-a.s)*k,x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k};}}
  return Z[Z.length-1];}
// ---------- phase 2 panel ----------
var p2=document.getElementById("p2"),P2=C.phase2,chipsEl=p2.querySelector(".chips"),shackle=document.getElementById("shackle");
if(P2&&P2.title)p2.querySelector(".ttl").textContent=P2.title;
var chips=(P2?P2.items:[]).map(function(it){var d=document.createElement("div");d.className="chip";d.innerHTML="<small>"+(it.k||"")+"</small>"+it.t;chipsEl.appendChild(d);return d;});
var brand=document.getElementById("brand");brand.querySelector(".tag2").textContent=C.tagline;brand.querySelector(".handle").textContent=C.handle;
var gridrect=document.getElementById("gridrect"),bar=document.getElementById("bar");
var lastSrc=null;
function render(t){
  t=Math.max(0,Math.min(T,t));
  gridrect.setAttribute("y",-40+(t*10)%40);
  CARDS.forEach(function(o){var cd=o.cd;var vin=o.first?1:eout(seg(t,cd.t0-.08,cd.t0+.22)),vout=1-eio(seg(t,cd.t1-.12,cd.t1+.18));
    var on=t>=cd.t0-.1&&t<cd.t1+.2;o.el.style.display=on?"flex":"none";if(!on)return;
    o.el.style.opacity=vin*vout;o.el.style.transform="translateY("+(40*(1-vin)-60*(1-vout))+"px)";
    o.ws.forEach(function(x){var a=x.w.t-.04,p=o.first?1:seg(t,a,a+.16);var pop=x.w.e?(1+.16*Math.sin(Math.PI*seg(t,a+.05,a+.4))):1;
      x.el.style.opacity=p;x.el.style.transform="translateY("+(18*(1-eout(p)))+"px) scale("+((.92+.08*eob(p))*pop)+")";});});
  // phone
  var pin=eout(seg(t,PH.in,PH.in+.5)),pout=eio(seg(t,PH.out-.3,PH.out+.2));
  phone.style.opacity=pin*(1-pout);
  phone.style.transform="translateY("+(120*(1-pin)+80*pout)+"px) scale("+(.92+.08*pin-.06*pout)+")";
  var pr=null;
  if(t>=PH.in-.1&&t<PH.out+.3){var src=footFrame(t);var z=zoomAt(t);
    shot.style.transformOrigin=(z.x*100)+"% "+(z.y*100)+"%";shot.style.transform="scale("+z.s+")";
    if(src!==lastSrc){lastSrc=src;shot.src=src;pr=shot.decode().catch(function(){});}}
  taps.forEach(function(o){var a=o.tp.t,p=seg(t,a,a+.6);o.d.style.opacity=p>0&&p<1?(1-p):0;o.d.style.transform="scale("+(.4+1.2*eout(p))+")";});
  callouts.forEach(function(o){var c=o.co,v=eout(seg(t,c.t0,c.t0+.3))*(1-seg(t,c.t1-.2,c.t1));o.d.style.opacity=v;
    var x=c.side==="left"?(540-280+170):(540+280-170),y=PY-606+c.y*1212;  // overlaps the phone edge
    o.d.style.left=(c.side==="left"?x-o.d.offsetWidth:x)+"px";o.d.style.top=(y-30)+"px";
    o.d.style.transform="translateX("+((c.side==="left"?-1:1)*30*(1-v))+"px)";});
  // phase 2
  if(P2){var v=eout(seg(t,P2.t0,P2.t0+.4))*(1-eio(seg(t,P2.t1-.2,P2.t1+.2)));p2.style.opacity=v;
    var u=eio(seg(t,P2.unlockT,P2.unlockT+.45));shackle.setAttribute("transform","translate("+(105*0)+",0) rotate("+(-38*u)+" 105 80) translate(0,"+(-14*u)+")");
    chips.forEach(function(d,i){var a=P2.t0+.35+i*.22;var p=seg(t,a,a+.3);d.style.opacity=p*(.35+.65*u);
      d.style.borderColor=u>.5?"rgba(255,122,26,.6)":"#2B2F38";d.style.transform="translateY("+(20*(1-eout(p)))+"px)";});}
  subs.forEach(function(o){var a=o.sb.t0,b=o.sb.t1,v=seg(t,a,a+.15)*(1-seg(t,b-.1,b));o.d.style.opacity=v;});
  bar.style.width=(100*t/T)+"%";
  var pb=eio(seg(t,C.brandT,C.brandT+.4));brand.style.opacity=pb;brand.style.transform="scale("+(.96+.04*pb)+")";
  cardsEl.style.opacity=1-pb;
  return pr||Promise.resolve();
}
window.__duration=T;window.__seek=function(t){return render(t);};render(0);
var playing=false,t0=0;
document.getElementById("playBtn").onclick=function(){this.style.display="none";t0=performance.now();playing=true;
  var a=new Audio("audio_mixed.mp3");a.play().catch(function(){});(function loop(){if(!playing)return;var t=(performance.now()-t0)/1000;render(t);if(t<T)requestAnimationFrame(loop);})();};
})();
