<html><head><meta charset="utf-8"><title>dmyor reel</title>
<style>
:root{
  --ink:#F7F7FB; --dim:#9BA0B4; --deep:#070812;
  --blue:#5B8CFF; --cyan:#33D6F5; --green:#34D399;
  --coral:#FB7185; --amber:#FBBF24; --violet:#A855F7;
}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
/* Slim grotesque at light weights. Big type carries the elegance through the
   letterforms and the space around them, not through weight. Light (300) rather
   than Thin (100) so it survives a phone screen at speed. */
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:center center;
 background:var(--deep);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
 font-family:"Helvetica Neue","Avenir Next",-apple-system,Helvetica,Arial,sans-serif}
#stage.serif{font-family:"Didot","Iowan Old Style","Palatino",Georgia,serif}
/* flat colour: hard blocks that wipe, no gradients */
#bg{position:absolute;inset:0;background:#08080C}
.bgpane{position:absolute;inset:0;transform:translateY(100%)}
/* a thin rule that sweeps the frame on a cut */
#sweep{position:absolute;left:0;width:100%;height:4px;opacity:0}
#grain{position:absolute;inset:0;opacity:.045;pointer-events:none;
 background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:3px 3px}
/* camera holds every scene, so a zoom moves the whole frame */
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.layer{position:absolute;inset:0}
/* kinetic type */
.kt{position:absolute;left:0;width:1080px;text-align:center;color:var(--ink);
 font-weight:250;letter-spacing:.2px;line-height:1.22;padding:0 76px;box-sizing:border-box}
.kt .accent{font-weight:300}
.kt.demi{font-weight:300;letter-spacing:-.2px}
.kt.demi .accent{font-weight:400}
.kt .w{display:inline-block;margin:0 .16em;will-change:transform,opacity}
.kt .accent{color:var(--blue)}
.kt.sub{font-weight:300;letter-spacing:1.2px;color:#C7CCDB;line-height:1.4}
/* big -> small */
#mcollapse{position:absolute;left:0;width:1080px;opacity:0;text-align:center}
#mclBig{font-size:64px;font-weight:250;letter-spacing:-.5px;color:var(--ink)}
#mclSmall{margin-top:30px;display:inline-block;border:2px solid var(--green);border-radius:36px;
 padding:20px 42px;font-size:40px;font-weight:300;color:var(--ink);opacity:0;background:rgba(52,211,153,.10)}
/* vague -> checkable */
#msharp{position:absolute;left:0;width:1080px;opacity:0;text-align:center}
#msOld{font-size:52px;font-weight:300;color:#C7CCDB}
#msNew{margin-top:22px;font-size:60px;font-weight:300;color:var(--ink)}
/* numbered steps */
#msteps{position:absolute;left:132px;width:816px;opacity:0}
.mstep{display:flex;align-items:baseline;gap:22px;margin-top:26px;opacity:.32}
.mstep.on{opacity:1}
.mstep i{font-style:normal;font-size:30px;font-weight:400;letter-spacing:3px;color:var(--blue);min-width:60px}
.mstep span{font-size:44px;font-weight:300;letter-spacing:.2px;color:var(--ink)}
/* odometer digits */
#roll{position:absolute;left:0;width:1080px;opacity:0;text-align:center}
.rollg{display:inline-block;overflow:hidden;height:150px;vertical-align:top}
.rollg .rs{display:block;font-size:126px;font-weight:250;line-height:150px;letter-spacing:-2px;color:var(--ink)}
#rollTail{margin-top:16px;font-size:42px;font-weight:300;letter-spacing:6px;color:#C7CCDB}
/* tokens that slam in */
#tokens{position:absolute;left:0;width:1080px;opacity:0;display:flex;justify-content:center;gap:20px}
.tok{border:2px solid;border-radius:18px;padding:24px 30px;font-size:42px;font-weight:300;
 white-space:nowrap;opacity:0;background:rgba(255,255,255,.06);color:var(--ink)}
/* one big number counting */
#bignum{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
#bignumV{font-size:250px;font-weight:200;letter-spacing:-10px;line-height:1;
 font-variant-numeric:tabular-nums;color:var(--ink)}
#bignumL{margin-top:8px;font-size:40px;font-weight:300;letter-spacing:8px;color:#C7CCDB}
/* a wall of day marks */
.daygrid{position:absolute;left:110px;width:860px;opacity:0;
 display:grid;grid-template-columns:repeat(15,1fr);gap:9px}
.dm{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.10);transform:scale(.3);opacity:0}
.dm.on{background:var(--ink)}
.dm.miss{background:transparent;box-shadow:inset 0 0 0 2px var(--coral)}
.dm.dead{background:rgba(251,113,133,.25)}
.dayLabel{position:absolute;left:0;width:1080px;text-align:center;font-size:54px;
 font-weight:250;letter-spacing:1px;color:#C7CCDB;opacity:0}
/* threshold ticks */
#thresh{position:absolute;left:0;width:1080px;opacity:0;display:flex;justify-content:center;gap:56px}
.th{text-align:center;opacity:0}
.th .thn{font-size:96px;font-weight:250;letter-spacing:-2px;color:var(--ink)}
.th .thl{margin-top:12px;font-size:32px;font-weight:300;letter-spacing:.4px;color:#C7CCDB;max-width:300px;line-height:1.28}
/* the bad-day floor */
#floor{position:absolute;left:230px;width:620px;opacity:0}
#floorBar{height:190px;border-radius:16px;border:2px solid var(--blue);position:relative;overflow:hidden}
#floorFill{position:absolute;left:0;right:0;bottom:0;height:0%;background:rgba(91,140,255,.28)}
#floorLine{position:absolute;left:0;right:0;bottom:26%;height:3px;background:var(--green);opacity:0}
#floorTag{position:absolute;right:14px;font-size:30px;font-weight:300;letter-spacing:2px;color:var(--green);opacity:0}
#floorCap{margin-top:24px;text-align:center;font-size:38px;font-weight:300;color:#C7CCDB}
/* two paths from one origin */
#paths{position:absolute;inset:0;opacity:0}
#pathSvg2{position:absolute;left:0;top:0;width:1080px;height:1920px}
.plabel{position:absolute;font-size:32px;letter-spacing:2px;text-transform:uppercase;opacity:0}
/* candidate answers */
#cands{position:absolute;left:0;top:0;width:1080px;opacity:0}
.cand{position:absolute;left:50%;transform:translateX(-50%);box-sizing:border-box;
 border-radius:999px;padding:20px 48px;font-size:37px;font-weight:300;letter-spacing:.3px;white-space:nowrap;
 border:2px solid;background:rgba(255,255,255,.04);opacity:0}
.cand .cline{position:absolute;left:8%;top:52%;width:84%;height:3px;border-radius:3px;
 transform:scaleX(0);transform-origin:left center}
/* a field of capability */
#field{position:absolute;inset:0;opacity:0}
.fdot{position:absolute;border-radius:50%}
/* an empty plan */
#plan{position:absolute;left:110px;width:860px;opacity:0;box-sizing:border-box;
 border:2px solid rgba(255,255,255,.18);border-radius:22px;background:rgba(255,255,255,.03);padding:34px}
#planTitle{font-size:38px;font-weight:300;letter-spacing:.4px;color:var(--ink)}
.prow{margin-top:20px;height:22px;border-radius:8px;background:rgba(255,255,255,.06)}
#planStamp{margin-top:26px;font-size:31px;letter-spacing:3px;text-transform:uppercase;
 color:var(--coral);opacity:0}
/* chips: dreams, then the archive they become */
#chips{position:absolute;inset:0;opacity:0}
.chip{position:absolute;box-sizing:border-box;border-radius:14px;padding:15px 20px;
 font-size:27px;font-weight:300;letter-spacing:.2px;line-height:1.25;border:1px solid;white-space:nowrap;overflow:hidden}
.chip .cmeta{display:block;margin-top:8px;font-size:19px;letter-spacing:2px}
/* the empty slot waiting for you */
#slot{position:absolute;left:100px;width:880px;opacity:0;box-sizing:border-box;
 border:2px dashed var(--blue);border-radius:22px;padding:34px;background:rgba(91,140,255,.07)}
#slotLabel{font-size:26px;letter-spacing:4px;text-transform:uppercase;color:var(--blue)}
#slotText{margin-top:20px;font-size:46px;font-weight:300;letter-spacing:.3px;color:var(--ink)}
/* two stages */
#stages{position:absolute;left:90px;width:900px;opacity:0}
.stg{box-sizing:border-box;border-radius:20px;padding:26px 30px;margin-top:18px;
 border:2px solid rgba(255,255,255,.16);position:relative;overflow:hidden}
.stg .sfill{position:absolute;inset:0;width:0%;opacity:.22}
.stg .sn{position:relative;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:#C7CCDB}
.stg .st{position:relative;margin-top:12px;font-size:46px;font-weight:300;letter-spacing:.2px;color:var(--ink)}
.stg .sd{position:relative;margin-top:10px;font-size:32px;font-weight:300;color:#C7CCDB}

#missr{position:absolute;left:0;width:1080px;opacity:0}
.mrow{display:flex;align-items:center;gap:26px;margin:0 auto 34px;width:900px;opacity:0}
.mrlab{width:150px;text-align:right;font-size:30px;font-weight:300;letter-spacing:1px;flex:none}
.mrcells{display:flex;gap:10px}
.mc{width:52px;height:52px;border-radius:11px;background:rgba(255,255,255,.10);
 border:2px solid transparent;box-sizing:border-box}
.mc.on{background:var(--ink)}
.mc.gap{background:transparent;border-color:var(--coral)}
.mc.dead{background:rgba(255,255,255,.06)}
#mrVerdict{margin-top:14px;text-align:center;font-size:44px;font-weight:300;letter-spacing:.5px;opacity:0}
/* diagram: compounding arc */
#arcw{position:absolute;left:0;width:1080px;opacity:0}
#arcSvg{width:1080px;height:700px;display:block}
#arcMarks{position:relative;height:0}
.amk{position:absolute;transform:translateX(-50%);text-align:center;opacity:0}
.amk .amn{font-size:52px;font-weight:300;color:var(--ink);letter-spacing:-1px}
.amk .aml{margin-top:8px;font-size:27px;font-weight:300;color:#C7CCDB;max-width:270px;line-height:1.28}
#arcCap{margin-top:26px;text-align:center;font-size:34px;font-weight:300;color:#C7CCDB;opacity:0}
/* diagram: method pipeline */
#flow{position:absolute;left:0;width:1080px;opacity:0}
#flowRow{display:flex;align-items:stretch;justify-content:center;gap:0}
.fnode{width:236px;box-sizing:border-box;border:2px solid;border-radius:20px;padding:26px 20px;
 text-align:center;background:rgba(255,255,255,.04);opacity:0}

.fnode .fnt{margin-top:12px;font-size:36px;font-weight:300;color:var(--ink);line-height:1.2}
.fconn{align-self:center;width:56px;height:3px;background:var(--dim);transform:scaleX(0);
 transform-origin:left center;flex:none}
#flowCap{margin-top:30px;text-align:center;font-size:34px;font-weight:300;color:#C7CCDB;opacity:0}
/* end */
#endc{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
#endMark{font-size:122px;font-weight:250;letter-spacing:-1px;color:var(--ink)}
#endUrl{margin-top:30px;font-size:46px;letter-spacing:2.4px;font-weight:300;color:var(--blue);
 font-variant-numeric:tabular-nums}
#playBtn{position:fixed;inset:0;margin:auto;width:210px;height:64px;border-radius:32px;
 border:2px solid var(--blue);background:rgba(7,8,18,.92);color:var(--ink);font-family:inherit;
 font-size:18px;letter-spacing:2px;cursor:pointer;z-index:1000}

var eo=function(x){return 1-Math.pow(1-x,3)};
var eob=function(x){var c=1.7;return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}; // slight overshoot

// ---------- camera ----------
var camEl=document.getElementById("cam");
var CAM=(TL.camera||[]).slice().sort(function(a,b){return a.t-b.t;});
function camAt(t){
  if(!CAM.length) return {s:1,x:0,y:0};
  if(t<=CAM[0].t) return CAM[0];
  for(var i=0;i<CAM.length-1;i++){ var a=CAM[i],b=CAM[i+1];
    if(t>=a.t&&t<=b.t){ var k=eio((t-a.t)/Math.max(1e-6,b.t-a.t));
      return {s:(a.s||1)+((b.s||1)-(a.s||1))*k, x:(a.x||0)+((b.x||0)-(a.x||0))*k,
              y:(a.y||0)+((b.y||0)-(a.y||0))*k}; } }
  return CAM[CAM.length-1];
}

// ================= render =================
function render(t){
 t=Math.max(0,Math.min(TOTAL,t));

 // flat colour: each pane wipes across and stays until the next one covers it
 BG.forEach(function(b,i){
  var k=eio(seg(t,b.t,b.t+(b.dur||0.55)));
  var dir=b.dir||"up";
  var off=(1-k)*100;
  var tf = dir==="down" ? "translateY("+(-off)+"%)"
        : dir==="left" ? "translateX("+off+"%)"
        : dir==="right"? "translateX("+(-off)+"%)"
        : "translateY("+off+"%)";
  bgPanes[i].style.transform=tf; });
 // a rule that sweeps the frame on each colour change
 var swk=0, swy=0;
 BG.forEach(function(b){ var d=t-b.t;
  if(d>=0&&d<0.5){ swk=1-d/0.5; swy=eio(d/0.5)*1920; } });
 sweepEl.style.top=swy+"px"; sweepEl.style.background=CO.ink; fade(sweepEl,swk*0.5);

 // camera. On top of the keyframes there is a permanent slow drift: between two
 // keyframes the frame would otherwise be perfectly still, and a still frame reads
 // as a photograph no matter how much colour is in it.
 var c=camAt(t);
 // amplitude and rate matter: a 9px drift over a 0.4s window is sub-pixel and
 // registers as a frozen frame. This moves ~5px per sample without reading as a move.
 var driftS=1+Math.sin(t*0.75)*0.010;
 var driftX=Math.sin(t*0.62)*17, driftY=Math.cos(t*0.71)*19;
 camEl.style.transform="translate("+(-(c.x||0)+driftX)+"px,"+(-(c.y||0)+driftY)+"px) scale("+((c.s||1)*driftS)+")";

 // kinetic type: words arrive one after another, leave together
 KTS.forEach(function(K){
  var k=K.sc;
  var vis=seg(t,k.in,k.in+0.25)*(1-seg(t,k.out-0.35,k.out));
  fade(K.el,vis);
  K.spans.forEach(function(sp,i){
   var st=k.in+i*(k.stagger||0.075);
   var p=eob(cl((t-st)/0.42));
   var out=seg(t,k.out-0.35,k.out);
   sp.style.transform="translateY("+((1-p)*46 - out*30)+"px) scale("+(0.86+0.14*p)+")";
   sp.style.opacity=cl(p*1.2); }); });



 // panels breathe: a scene that has finished animating must not sit perfectly still
 function floaty(el,ph,amp){ if(el && el.style.opacity!=="0")
   el.style.transform="translateY("+(Math.sin(t*0.95+ph)*(amp||10))+"px)"; }
 floaty(collapseEl,0.4,11); floaty(sharpenEl,1.7,10); floaty(tokensEl,2.9,9);
 floaty(floorEl,0.9,10); floaty(threshEl,2.2,9); floaty(steps3El,1.1,8);
 floaty(missrEl,1.4,9); floaty(arcwEl,2.6,8); floaty(flowEl,0.7,10);


 // the whole ambition contracting to one unit
 if(clSc){ fade(collapseEl, seg(t,clSc.in,clSc.in+0.3)*(1-seg(t,clSc.out,clSc.out+0.4)));
  var cp=eio(seg(t,clSc.at,clSc.at+0.9));
  clBig.style.transform="scale("+(1-0.44*cp)+")"; clBig.style.opacity=1-0.6*cp;
  var sp=eob(cl((t-(clSc.at+0.45))/0.6));
  clSmall.style.opacity=cl(sp); clSmall.style.transform="scale("+(0.8+0.2*cl(sp))+")"; }
 else fade(collapseEl,0);

 // a vague goal resolving into a checkable one
 if(shSc){ fade(sharpenEl, seg(t,shSc.in,shSc.in+0.3)*(1-seg(t,shSc.out,shSc.out+0.4)));
  var vt=shSc.vagueAt!=null?shSc.vagueAt:shSc.in;
  var vn=Math.floor(cl((t-vt)/0.8)*(shSc.vague||"").length);
  shOld.textContent=(shSc.vague||"").slice(0,vn);
  var rp=seg(t,shSc.at,shSc.at+0.9), raw=shSc.specific||"";
  var keep=Math.round(raw.length*eo(rp));
  shNew.textContent=raw.slice(0,keep)+raw.slice(keep).replace(/\S/g,"\u00b7");
  shOld.style.opacity=1-0.75*rp; shOld.style.textDecoration=rp>0.3?"line-through":"none";
  shNew.style.opacity=rp>0.02?1:0;
  shNew.style.transform="scale("+(0.94+0.06*rp)+")"; }
 else fade(sharpenEl,0);

 // the three steps, one per spoken instruction
 if(st3Sc){ fade(steps3El, seg(t,st3Sc.in,st3Sc.in+0.3)*(1-seg(t,st3Sc.out,st3Sc.out+0.4)));
  (st3Sc.at||[]).forEach(function(a2,i){ if(!s3Els[i])return;
   s3Els[i].classList.toggle("on", t>=a2);
   var k=eob(cl((t-a2)/0.45));
   s3Els[i].style.transform="translateX("+((1-k)*-46)+"px)"; }); }
 else fade(steps3El,0);

 // odometer: the date rolls forward
 if(rlSc){ fade(rollEl, seg(t,rlSc.in,rlSc.in+0.3)*(1-seg(t,rlSc.out,rlSc.out+0.4)));
  rollGlyphs.forEach(function(g,i){
   var st=(rlSc.roll||rlSc.in)+i*0.07, k=eio(cl((t-st)/0.75));
   if(g.from===g.to){ g.st.textContent=g.to; g.st.style.transform="translateY(0)"; return; }
   // spin through digits, land on the target
   var spin=Math.floor((1-k)*14);
   g.st.textContent = k>=1 ? g.to : String((parseInt(g.to,10)||0 + spin)%10);
   g.st.style.transform="translateY("+((1-k)*-26)+"px)"; }); }
 else fade(rollEl,0);

 // tokens slam in, one per phrase
 if(tkSc){ fade(tokensEl, seg(t,tkSc.in,tkSc.in+0.25)*(1-seg(t,tkSc.out,tkSc.out+0.4)));
  tokEls.forEach(function(T){ var k=eob(cl((t-T.sc.at)/0.34));
   T.el.style.opacity=cl(k*1.3);
   T.el.style.transform="translateY("+((1-k)*70)+"px) scale("+(0.7+0.3*k)+")"; }); }
 else fade(tokensEl,0);

 // one big number counting up
 if(bnSc){ fade(bignumEl, seg(t,bnSc.in,bnSc.in+0.3)*(1-seg(t,bnSc.out,bnSc.out+0.4)));
  var bk=eo(seg(t,bnSc.start||bnSc.in,bnSc.end||bnSc.out));
  bignumV.textContent=Math.round(bk*(bnSc.to||120));
  bignumV.style.transform="scale("+(0.94+0.06*bk)+")"; }
 else fade(bignumEl,0);

 // the wall of days
 DG.forEach(function(G){
  var sc2=G.sc;
  var dv=seg(t,sc2.in,sc2.in+0.3)*(1-seg(t,sc2.out,sc2.out+0.4));
  fade(G.el,dv); fade(G.lab,dv);
  var fs=sc2.fillStart!=null?sc2.fillStart:sc2.in, fe=sc2.fillEnd!=null?sc2.fillEnd:sc2.out;
  var shown=Math.floor(cl((t-fs)/Math.max(0.1,fe-fs))*G.cells.length);
  var miss=sc2.miss||[], dead=sc2.dead||[];
  G.cells.forEach(function(d,i){
   var on=i<shown;
   var age=on?(shown-i):0, lead=on&&age<26?(1-age/26):0;
   d.style.opacity=on?(0.82+0.18*Math.sin(t*3.1+i*0.7)*lead+0.18*(1-lead)):0.12;
   d.style.transform="scale("+(on?(1+0.14*lead*Math.abs(Math.sin(t*2.6+i*0.5))):0.3)+")";
   d.className="dm"+(on?" on":"")+
     (miss.indexOf(i)>=0&&on?" miss":"")+(dead.indexOf(i)>=0&&on?" dead":"");
  });
  G.lab.textContent=(sc2.label||"").replace("{n}",shown);
 });

 // diagram: one gap recovers, two gaps break the chain
 if(mrSc){ fade(missrEl, seg(t,mrSc.in,mrSc.in+0.3)*(1-seg(t,mrSc.out,mrSc.out+0.4)));
  mrRows.forEach(function(R){
   var at=R.sc.at||mrSc.in;
   fade(R.row, seg(t,at,at+0.35));
   var step=R.sc.step||0.085;               // cells land left to right
   R.cells.forEach(function(C,i){
    var k=seg(t,at+0.25+i*step,at+0.25+i*step+0.16);
    if(k<=0){ C.el.className="mc"; C.el.style.opacity=0; return; }
    C.el.style.opacity=1;
    C.el.className="mc"+(C.ch==="#"?" on":" gap");
   });
   // once the rule is broken every later cell goes dead
   if(R.sc.breakAt!=null && t>=R.sc.breakAt){
    var bk=eio(cl((t-R.sc.breakAt)/0.5));
    R.cells.forEach(function(C,i){
     if(i>=(R.sc.breakFrom||0) && C.ch==="#"){
      C.el.className="mc dead"; C.el.style.opacity=1-0.45*bk; } });
    R.row.style.opacity=1-0.25*bk; }
  });
  if(mrSc.verdictAt!=null){ var vk=eob(cl((t-mrSc.verdictAt)/0.45));
   mrVerd.textContent=mrSc.verdict||""; mrVerd.style.color=col(mrSc.verdictColor||"ink");
   mrVerd.style.opacity=cl(vk); mrVerd.style.transform="translateY("+((1-vk)*26)+"px)"; }
 } else fade(missrEl,0);

 // diagram: the arc that compounds, crossing its thresholds
 if(arSc){ fade(arcwEl, seg(t,arSc.in,arSc.in+0.35)*(1-seg(t,arSc.out,arSc.out+0.4)));
  var dk=eio(seg(t,arSc.drawAt||arSc.in,arSc.drawEnd||arSc.out));
  arcCurve.style.strokeDashoffset=arcLen*(1-dk);
  arcMarks.forEach(function(M){ var k=eob(cl((t-M.sc.at)/0.42));
   M.el.style.opacity=cl(k);
   M.el.style.transform="translateX(-50%) translateY("+((1-k)*30)+"px)";
   // the dot lands on the curve first, then the tick drops to the label
   M.dot.style.opacity=cl(eo(cl((t-M.sc.at)/0.3)));
   M.tick.style.opacity=0.55*cl(eo(cl((t-M.sc.at-0.12)/0.4))); });
  if(arSc.capAt!=null) fade(arcCap, seg(t,arSc.capAt,arSc.capAt+0.4));
 } else fade(arcwEl,0);

 // diagram: method pipeline, nodes then connectors
 if(fwSc){ fade(flowEl, seg(t,fwSc.in,fwSc.in+0.3)*(1-seg(t,fwSc.out,fwSc.out+0.4)));
  fwNodes.forEach(function(N,i){ var at=(fwSc.items[i]||{}).at||fwSc.in;
   var k=eob(cl((t-at)/0.42)); N.style.opacity=cl(k);
   N.style.transform="translateY("+((1-k)*34)+"px)"; });
  fwConns.forEach(function(C,i){ var at=(fwSc.items[i+1]||{}).at||fwSc.in;
   C.style.transform="scaleX("+eo(cl((t-(at-0.18))/0.34))+")"; });
  if(fwSc.capAt!=null) fade(flowCap, seg(t,fwSc.capAt,fwSc.capAt+0.4));
 } else fade(flowEl,0);

 // thresholds
 if(thSc){ fade(threshEl, seg(t,thSc.in,thSc.in+0.3)*(1-seg(t,thSc.out,thSc.out+0.4)));
  thEls.forEach(function(T){ var k=eob(cl((t-T.sc.at)/0.4));
   T.el.style.opacity=cl(k); T.el.style.transform="translateY("+((1-k)*40)+"px)"; }); }
 else fade(threshEl,0);

 // the bad-day floor
 if(flSc){ fade(floorEl, seg(t,flSc.in,flSc.in+0.3)*(1-seg(t,flSc.out,flSc.out+0.4)));
  floorFill.style.height=(eio(seg(t,flSc.fillAt||flSc.in,(flSc.fillAt||flSc.in)+0.9))*100)+"%";
  var lk=seg(t,flSc.floorAt||flSc.in,(flSc.floorAt||flSc.in)+0.5);
  fade(floorLine,lk); fade(floorTag,lk);
  floorTag.style.bottom=(flSc.floorPct||26)+"%";
  floorLine.style.bottom=(flSc.floorPct||26)+"%";
  // on a bad day the fill drops to the floor and stays legal
  var drop=flSc.dropAt!=null?eio(seg(t,flSc.dropAt,flSc.dropAt+0.7)):0;
  if(drop>0) floorFill.style.height=(100-(100-(flSc.floorPct||26))*drop)+"%"; }
 else fade(floorEl,0);

 // two paths from the same origin
 if(pSc){ fade(pathsEl, seg(t,pSc.in,pSc.in+0.4)*(1-seg(t,pSc.out,pSc.out+0.5)));
  var kA=eio(seg(t,pSc.start,pSc.winEnd||pSc.end));
  var kB=eio(seg(t,pSc.start,pSc.loseEnd||(pSc.start+(pSc.end-pSc.start)*0.55)));
  pA1.style.strokeDashoffset=pLenA*(1-kA);
  pB1.style.strokeDashoffset=pLenB*(1-kB);
  var ptA=pA1.getPointAtLength(pLenA*kA), ptB=pB1.getPointAtLength(pLenB*kB);
  pDotA.setAttribute("cx",ptA.x); pDotA.setAttribute("cy",ptA.y);
  pDotB.setAttribute("cx",ptB.x); pDotB.setAttribute("cy",ptB.y);
  pDotA.setAttribute("opacity",kA>0.01&&kA<0.999?1:0);
  pDotB.setAttribute("opacity",kB>0.01?1:0);
  pGoal.setAttribute("opacity",eo(seg(t,(pSc.winEnd||pSc.end)-0.3,(pSc.winEnd||pSc.end)+0.3)));
  pOrigin.setAttribute("opacity",seg(t,pSc.in,pSc.in+0.3));
  fade(plO, seg(t,pSc.in+0.2,pSc.in+0.6)); fade(plG, seg(t,pSc.in+0.2,pSc.in+0.6));
  fade(plA, seg(t,(pSc.winEnd||pSc.end),(pSc.winEnd||pSc.end)+0.4));
  fade(plB, seg(t,(pSc.loseEnd||pSc.start+1)+0.2,(pSc.loseEnd||pSc.start+1)+0.6)); }
 else fade(pathsEl,0);

 // candidate answers, dismissed one per question
 if(cSc){ fade(candsEl, seg(t,cSc.in,cSc.in+0.3)*(1-seg(t,cSc.out,cSc.out+0.4)));
  candEls.forEach(function(C,i){
   var a=C.sc.at, dz=C.sc.dismiss;
   var p=eob(cl((t-a)/0.4));
   C.el.style.opacity=cl(p);
   C.el.style.transform="translateX(-50%) scale("+(0.8+0.2*p)+")";
   if(dz!=null){ var dp=eio(seg(t,dz,dz+0.36));
    C.line.style.transform="scaleX("+dp+")";
    C.el.style.opacity=cl(p)*(1-0.55*dp); } }); }
 else fade(candsEl,0);

 // a field of capability, expanding
 if(fSc){ fade(fieldEl, seg(t,fSc.in,fSc.in+0.5)*(1-seg(t,fSc.out,fSc.out+0.5)));
  var grow=eio(seg(t,fSc.start||fSc.in,fSc.end||fSc.out));
  var coll=fSc.collapse!=null?eio(seg(t,fSc.collapse,fSc.collapseEnd||fSc.out)):0;
  fDots.forEach(function(d,i){
   var r=d.r*(0.18+0.82*grow)*(1-0.94*coll);
   var a2=d.a+t*0.09;
   var x=540+Math.cos(a2)*r*1.02, y=930+Math.sin(a2)*r*0.86;
   var yy=y+(coll)*( (930-y) );      // collapse toward a single line
   d.el.style.transform="translate("+x+"px,"+yy+"px)";
   d.el.style.opacity=(0.35+0.65*grow)*(1-0.7*coll)*(0.6+0.4*Math.sin(t*1.6+d.ph)); }); }
 else fade(fieldEl,0);

 // an empty plan
 if(plSc){ fade(planEl, seg(t,plSc.in,plSc.in+0.35)*(1-seg(t,plSc.out,plSc.out+0.4)));
  planEl.style.transform="translateY("+(Math.sin(t*0.9)*8)+"px)";
  fade(planStamp, plSc.stampAt!=null?eob(cl((t-plSc.stampAt)/0.4)):0); }
 else fade(planEl,0);

 // chips: scattered dreams that snap into an ordered archive
 if(chSc){ fade(chipsEl, seg(t,chSc.in,chSc.in+0.5)*(1-seg(t,chSc.out,chSc.out+0.5)));
  var ord=chSc.orderAt!=null?eio(seg(t,chSc.orderAt,chSc.orderAt+1.3)):0;
  chips.forEach(function(ch,i){
   var wob=Math.sin(t*0.7+i)*9*(1-ord);
   var x=ch.sx+(ch.gx-ch.sx)*ord, y=ch.sy+(ch.gy-ch.sy)*ord+wob;
   ch.el.style.transform="translate("+x+"px,"+y+"px)";
   ch.el.style.opacity=(0.42+0.58*ord);
   if(chSc.liveAt!=null && t>=chSc.liveAt){
     ch.el.style.borderColor=col(ch.cn); ch.meta.textContent=chSc.metaText||"on the record";
     ch.meta.style.color=col(ch.cn); }
   else { ch.el.style.borderColor="rgba(255,255,255,.16)"; ch.meta.textContent="standby";
     ch.meta.style.color=CO.dim; } }); }
 else fade(chipsEl,0);

 // the empty slot waiting for you
 if(slSc){ fade(slotEl, seg(t,slSc.in,slSc.in+0.35)*(1-seg(t,slSc.out,slSc.out+0.4)));
  var n2=Math.floor(cl((t-(slSc.typeAt||slSc.in))/1.1)*(slSc.text||"").length);
  slotText.textContent=(slSc.text||"").slice(0,n2)+((Math.floor(t*2)%2)?"|":"");
  slotEl.style.transform="scale("+(0.98+0.02*eob(cl((t-slSc.in)/0.5)))+")"; }
 else fade(slotEl,0);

 // two stages
 if(stSc){ fade(stagesEl, seg(t,stSc.in,stSc.in+0.4)*(1-seg(t,stSc.out,stSc.out+0.4)));
  stEls.forEach(function(Sg,i){
   var a3=Sg.sc.at!=null?Sg.sc.at:stSc.in;
   var p=eob(cl((t-a3)/0.45));
   Sg.el.style.transform="translateX("+((1-p)*(i%2?60:-60))+"px)";
   Sg.el.style.opacity=cl(p);
   Sg.el.style.borderColor= t>=a3+0.2 ? col(Sg.sc.color||"blue") : "rgba(255,255,255,.16)";
   Sg.fill.style.width=(eio(seg(t,Sg.sc.fillAt!=null?Sg.sc.fillAt:a3, (Sg.sc.fillAt!=null?Sg.sc.fillAt:a3)+1.1))*(Sg.sc.fillPct!=null?Sg.sc.fillPct:100))+"%"; }); }
 else fade(stagesEl,0);

 // end card, URL typing with the voice
 if(eSc){ fade(endc, seg(t,eSc.in,eSc.in+0.5));
  var ep=eob(cl((t-eSc.in)/0.6));
  endMark.style.transform="scale("+(0.9+0.1*ep)+")";
  var us=eSc.urlStart!=null?eSc.urlStart:eSc.in, ue=eSc.urlEnd!=null?eSc.urlEnd:eSc.in+2;
  var un=Math.floor(cl((t-us)/Math.max(0.1,ue-us))*URL_TXT.length);
  endUrl.textContent=t<us?"":URL_TXT.slice(0,un); }
 else fade(endc,0);
}

// ================= driver =================
var st0=null,raf=null;
function frame(now){ if(st0===null)st0=now; var t=(now-st0)/1000;
 if(t>=TOTAL){render(TOTAL);raf=null;return;} render(t); raf=requestAnimationFrame(frame); }
function play(){ document.getElementById("playBtn").style.display="none"; st0=null;
 if(raf)cancelAnimationFrame(raf); raf=requestAnimationFrame(frame); }
addEventListener("load",function(){
 render(0);
 window.__seek=function(x){render(x);}; window.__duration=TOTAL;
 var q=new URLSearchParams(location.search), tp=q.get("t");
 if(tp!==null&&!isNaN(parseFloat(tp))){ document.getElementById("playBtn").style.display="none"; render(parseFloat(tp)); return; }
 if(q.get("autoplay")==="1") play(); else document.getElementById("playBtn").addEventListener("click",play);
});
})();

</script>
</body></html>
